# 2022 개정 교육과정 성취기준 — curriculum-mapper 참조 자료
#
# 성취기준 원문은 NCIC 공공저작물이다. 이 파일은 지도서에 실린 두 판본
# (총론 교육과정 내용 체계 표 / 각론 평가 자료) 을 대조해 만들었다.
# 지도서 고유 해설(최소 성취 수준 등)은 천재교과서 저작물이라 옮기지 않았다.
#
# crosscheck: 일치   = 두 판본이 (공백 무시) 같다
#             불일치 = 판본이 갈린다. note 에 각론 판본을 적어 두었으니
#                      **사람이 NCIC 원문으로 확정**해야 한다. 그 전에는 C5 태깅에 쓰지 마라.
#             미대조 = 각론에서 짝을 못 찾았다
#
# 생성: scripts/extract_standards.py — 손으로 고치지 말고 스크립트를 고쳐라.

courses:
  12물에:
    name: 물질과 에너지
    type: 진로선택
    source: 지도서 총론 16~19쪽 (대조 - 각론 평가 자료 146~234쪽)
    standards:
    - code: 12물에01-01
      area: '01'
      seq: '01'
      area_name: 물질의 세 가지 상태
      text: 기체의 온도, 압력, 부피, 몰수 사이의 관계를 통합적으로 이해하고, 이상 기체 방정식을 근사적으로 활용하는 사례를 조사하여 화학의 유용함을 인식할 수 있다.
      source_page: 17
      crosscheck: 일치
    - code: 12물에01-02
      area: '01'
      seq: '02'
      area_name: 물질의 세 가지 상태
      text: 혼합 기체의 부분 압력과 몰분율의 관계를 알고, 일상생활에서 유용하게 사용되는 혼합 기체에 호기심을 가질 수 있다.
      source_page: 17
      crosscheck: 일치
    - code: 12물에01-03
      area: '01'
      seq: '03'
      area_name: 물질의 세 가지 상태
      text: 물질이 액체로 존재할 수 있는 이유를 분자 간 상호 작용으로 이해하고, 액체의 종류에 따라 끓는점이 달라짐을 설명할 수 있다.
      source_page: 17
      crosscheck: 일치
    - code: 12물에01-04
      area: '01'
      seq: '04'
      area_name: 물질의 세 가지 상태
      text: 고체를 결정과 비결정으로 구분하고, 결정성 고체를 화학 결합의 종류에 따라 분류할 수 있다.
      source_page: 17
      crosscheck: 일치
    - code: 12물에02-01
      area: '02'
      seq: '01'
      area_name: 용액의 성질
      text: 다른 액체와 구별되는 물의 성질을 수소 결합으로 설명하고, 경이로운 물의 성질에 흥미를 느낄 수 있다.
      source_page: 18
      crosscheck: 일치
    - code: 12물에02-02
      area: '02'
      seq: '02'
      area_name: 용액의 성질
      text: 실험 데이터를 이용하여 용액의 농도에 따른 증기압, 끓는점, 어는점의 변화를 비교하고, 일상생활에서 나타나는 사례와 연관 지어 설명할 수 있다.
      source_page: 18
      crosscheck: 불일치
      note: '각론 166쪽 판본: 실험 데이터를 이용하여 용액의 농도에 따른 증기 압력, 끓는점, 어는점의 변화를 비교하고, 일상생활에서 나타나는 사례와 연관 지어 설명할 수 있다.'
    - code: 12물에02-03
      area: '02'
      seq: '03'
      area_name: 용액의 성질
      text: 용액의 농도에 따른 삼투 현상을 이해하고, 일상생활에서 삼투 현상이 나타나는 사례를 찾아 화학 원리가 유용하게 적용됨을 인식할 수 있다.
      source_page: 18
      crosscheck: 일치
    - code: 12물에03-01
      area: '03'
      seq: '01'
      area_name: 화학 변화의 자발성
      text: 엔탈피의 의미를 알고, 엔탈피를 이용하여 열화학 반응식을 표현할 수 있다.
      source_page: 18
      crosscheck: 일치
    - code: 12물에03-02
      area: '03'
      seq: '02'
      area_name: 화학 변화의 자발성
      text: 측정하기 어려운 화학 반응의 엔탈피를 헤스 법칙으로 구하여 화학 법칙의 유용성을 인식할 수 있다.
      source_page: 18
      crosscheck: 불일치
      note: '각론 182쪽 판본: 정하기 어려운 화학 반응의 엔탈피를 헤스 법칙으로 구하여 화학 법칙의 유용성을 인식할 수 있다.'
    - code: 12물에03-03
      area: '03'
      seq: '03'
      area_name: 화학 변화의 자발성
      text: 엔트로피의 의미를 이해하고, 엔탈피와 엔트로피의 변화로 화학 변화의 자발성을 설명할 수 있다.
      source_page: 18
      crosscheck: 일치
    - code: 12물에04-01
      area: '04'
      seq: '01'
      area_name: 반응 속도
      text: 화학 반응 속도를 반응물의 농도로 표현할 수 있음을 알고, 자료 해석을 통하여 반응 속도식을 구할 수 있다.
      source_page: 19
      crosscheck: 일치
    - code: 12물에04-02
      area: '04'
      seq: '02'
      area_name: 반응 속도
      text: 1차 반응의 반감기가 반응물의 농도에 의존하지 않음을 이해하고, 1차 반응의 반감기가 활용되는 사례를 조사·발표할 수 있다.
      source_page: 19
      crosscheck: 일치
    - code: 12물에04-03
      area: '04'
      seq: '03'
      area_name: 반응 속도
      text: 화학 반응에서 유효 충돌과 활성화 에너지의 의미를 알고, 화학 반응이 일어나기 위한 조건에 관심을 가질 수 있다.
      source_page: 19
      crosscheck: 일치
    - code: 12물에04-04
      area: '04'
      seq: '04'
      area_name: 반응 속도
      text: 농도, 온도, 촉매에 따라 반응 속도가 달라짐을 이해하고, 일상생활에서 각각의 예를 찾아 화학의 유용성을 인식할 수 있다.
      source_page: 19
      crosscheck: 미대조
  12반응:
    name: 화학 반응의 세계
    type: 진로선택
    source: 지도서 고_화학반응의세계(임희준)_지도서.pdf 총론 17~19쪽 (대조 - 각론 146~200쪽)
    standards:
    - code: 12반응01-01
      area: '01'
      seq: '01'
      area_name: 산 염기 평형
      text: 브뢴스테드·라우리 산과 염기의 정의를 이해하고, 이에 따라 산과 염기를 구별할 수 있다.
      source_page: 17
      crosscheck: 일치
    - code: 12반응01-02
      area: '01'
      seq: '02'
      area_name: 산 염기 평형
      text: 이온화 상수를 이용하여 산과 염기의 상대적인 세기를 추론하고, 약산과 약염기 수용액의 pH를 구할 수 있다.
      source_page: 17
      crosscheck: 일치
    - code: 12반응01-03
      area: '01'
      seq: '03'
      area_name: 산 염기 평형
      text: 중화 적정 실험의 pH 변화를 데이터에 근거하여 해석할 수 있다.
      source_page: 17
      crosscheck: 일치
    - code: 12반응01-04
      area: '01'
      seq: '04'
      area_name: 산 염기 평형
      text: 이온화 상수를 이용하여 염의 가수 분해를 설명할 수 있다.
      source_page: 17
      crosscheck: 일치
    - code: 12반응01-05
      area: '01'
      seq: '05'
      area_name: 산 염기 평형
      text: 화학 평형으로 생체 내 완충 작용을 설명하고, 화학 원리의 신비로움을 느낄 수 있다.
      source_page: 17
      crosscheck: 일치
    - code: 12반응02-01
      area: '02'
      seq: '01'
      area_name: 산화·환원 반응
      text: 전자의 이동과 산화수 변화로 산화·환원 반응을 이해하고, 반쪽 반응식을 활용하여 산화·환원 반응식을 완성할 수 있다.
      source_page: 18
      crosscheck: 일치
    - code: 12반응02-02
      area: '02'
      seq: '02'
      area_name: 산화·환원 반응
      text: 화학 전지의 발전 과정을 조사하여 실용 전지의 구조적 공통점을 추론할 수 있다.
      source_page: 18
      crosscheck: 일치
    - code: 12반응02-03
      area: '02'
      seq: '03'
      area_name: 산화·환원 반응
      text: 화학 전지의 원리를 산화·환원 반응으로 설명하고, 표준 환원 전위를 이용하여 전위차를 구할 수 있다.
      source_page: 18
      crosscheck: 일치
    - code: 12반응02-04
      area: '02'
      seq: '04'
      area_name: 산화·환원 반응
      text: 전기 분해의 원리를 산화·환원 반응으로 설명하고, 산업 현장에서 활용되는 전기 분해의 예를 조사하여 발표할 수 있다.
      source_page: 18
      crosscheck: 일치
    - code: 12반응02-05
      area: '02'
      seq: '05'
      area_name: 산화·환원 반응
      text: 생명 현상 및 화학 전지에서 이용되는 다양한 산화·환원 반응과 그 반응에 이용된 물질의 역할을 조사하여 화학의 신비로움을 느낄 수 있다.
      source_page: 18
      crosscheck: 일치
    - code: 12반응03-01
      area: '03'
      seq: '01'
      area_name: 탄소 화합물과 반응
      text: 일상생활에 유용한 탄소 화합물을 작용기에 따라 분류할 수 있다.
      source_page: 19
      crosscheck: 미대조
    - code: 12반응03-02
      area: '03'
      seq: '02'
      area_name: 탄소 화합물과 반응
      text: 간단한 탄소 화합물의 화학 반응 예를 찾아 작용기의 변화로 설명할 수 있다.
      source_page: 19
      crosscheck: 미대조
    - code: 12반응03-03
      area: '03'
      seq: '03'
      area_name: 탄소 화합물과 반응
      text: 단위체의 중합 반응으로 다양한 고분자가 합성되는 것을 이해하여 화학 반응의 유용성을 인식할 수 있다.
      source_page: 19
      crosscheck: 미대조
    - code: 12반응03-04
      area: '03'
      seq: '04'
      area_name: 탄소 화합물과 반응
      text: 탄소 화합물의 반응을 통해 합성된 새로운 물질이 과학·기술·사회 발전에 끼친 영향을 조사하여 화학의 유용성을 깨달을 수 있다.
      source_page: 19
      crosscheck: 일치

  10통과2:
    name: 통합과학2
    type: 공통
    source: 지도서 총론 15~17쪽 (비상교육, 신영준 외)
    note: >-
      ⑵ 환경과 에너지의 여섯 코드는 총론 표에서 뒷자리가 모두 02-01 로 뭉개져
      추출된다(폰트 인코딩 결함). 문장은 온전하고 순서도 분명해 나온 차례대로
      02-01~02-06 을 매겼으나, **코드 자체를 원문에서 읽은 것이 아니다** —
      crosscheck 를 미대조로 두었다. 사람이 NCIC 원문으로 확정하기 전에는
      C5 태깅에 쓰지 마라. 해설 절에서 02-01·02-04·02-05·02-06 은 눈으로 확인된다.
    standards:
    - code: 10통과2-01-01
      area: '01'
      seq: '01'
      area_name: 변화와 다양성
      text: "지질시대를 통해 지구 환경이 끊임없이 변화해 왔으며 이러한 환경 변화가 생물다양성에 미치는 영향을 추론할 수 있다."
      source_page: 15
      crosscheck: 일치
    - code: 10통과2-01-02
      area: '01'
      seq: '02'
      area_name: 변화와 다양성
      text: "변이의 발생과 자연선택 과정을 통해 생물의 진화가 일어나고, 진화의 과정을 통해 생물다 양성이 형성되었음을 추론할 수 있다."
      source_page: 15
      crosscheck: 일치
    - code: 10통과2-01-03
      area: '01'
      seq: '03'
      area_name: 변화와 다양성
      text: "자연과 인류의 역사에 큰 변화를 가져온 광합성, 화석 연료 사용, 철의 제련 등에서 공통점 을 찾아 산화와 환원을 이해하고, 생활 주변의 다양한 변화를 산화와 환원의 특징과 규칙성 으로 분석할 수 있다."
      source_page: 15
      crosscheck: 일치
    - code: 10통과2-01-04
      area: '01'
      seq: '04'
      area_name: 변화와 다양성
      text: "대표적인 산·염기 물질의 특징을 알고, 산과 염기를 혼합할 때 나타나는 중화 반응을 생활 속에서 이용할 수 있다."
      source_page: 15
      crosscheck: 일치
    - code: 10통과2-01-05
      area: '01'
      seq: '05'
      area_name: 변화와 다양성
      text: "생활 주변에서 에너지를 흡수하거나 방출하는 현상을 찾아 에너지의 흡수 방출이 우리 생 활에 어떻게 이용되는지 토의할 수 있다."
      source_page: 15
      crosscheck: 일치
    - code: 10통과2-02-01
      area: '02'
      seq: '01'
      area_name: 환경과 에너지
      text: "생태계구성요소를 이해하고 생물과 환경 사이의 상호 관계를 설명할 수 있다."
      source_page: 16
      crosscheck: 미대조
    - code: 10통과2-02-02
      area: '02'
      seq: '02'
      area_name: 환경과 에너지
      text: "먹이 관계와 생태 피라미드를 중심으로 생태계 평형이 유지되는 과정을 이해하고, 환경의 변화가 생태계에 미칠 수 있는 영향에 대해 협력적으로 소통할 수 있다."
      source_page: 16
      crosscheck: 미대조
    - code: 10통과2-02-03
      area: '02'
      seq: '03'
      area_name: 환경과 에너지
      text: "온실효과 강화로 인한 지구온난화의 메커니즘을 이해하고, 엘니뇨, 사막화 등과 같은 현상 이 지구 환경과 인간 생활에 미치는 영향과 대처 방안을 분석할 수 있다."
      source_page: 16
      crosscheck: 미대조
    - code: 10통과2-02-04
      area: '02'
      seq: '04'
      area_name: 환경과 에너지
      text: "태양에서 수소 핵융합 반응을 통해 질량 일부가 에너지로 바뀌고, 그중 일부가 지구에서 에 너지 흐름을 일으키며 다양한 에너지로 전환되는 과정을 추론할 수 있다."
      source_page: 16
      crosscheck: 미대조
    - code: 10통과2-02-05
      area: '02'
      seq: '05'
      area_name: 환경과 에너지
      text: "발전기에서 운동 에너지가 전기 에너지로 전환되는 과정을 이해하고, 열원으로서 화석 연 료, 핵에너지를 이용하는 발전소가 인간 생활에 미치는 영향을 조사·발표 할 수 있다."
      source_page: 16
      crosscheck: 미대조
    - code: 10통과2-02-06
      area: '02'
      seq: '06'
