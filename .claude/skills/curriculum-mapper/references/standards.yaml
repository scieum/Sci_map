      source_page: 17
      crosscheck: 일치
    - code: 12물에01-02
      area: '01'
      seq: '02'
      area_name: 물질의 세 가지 상태
      text: 혼합 기체의 부분 압력과 몰분율의 관계를 알고, 일상생활에서 유용하게 사용되는 혼합 기체에 호기심을 가질 수 있다.
      source_page: 17
      crosscheck: 일치
    - code: 12물에01-03
