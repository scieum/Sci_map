# 2022 개정 교육과정 성취기준 — curriculum-mapper 참조 자료
#
# 성취기준 원문은 NCIC 공공저작물이다. 이 파일은 지도서에 실린 두 판본
# (총론 교육과정 내용 체계 표 / 각론 평가 자료) 을 대조해 만들었다.
# 지도서 고유 해설(최소 성취 수준 등)은 천재교과서 저작물이라 옮기지 않았다.
#
# crosscheck: 일치   = 두 판본이 (공백·가운뎃점 무시) 같다 — 같은 문장을 총론은 '·',
#                      각론은 'ㆍ' 로 찍는 판형이 있어 조판 차이는 이견으로 보지 않는다
#             불일치 = 판본이 갈린다. note 에 각론 판본을 적어 두었으니
#                      **사람이 NCIC 원문으로 확정**해야 한다. 그 전에는 C5 태깅에 쓰지 마라.
#             미대조 = 각론에서 짝을 못 찾았다
#
# 생성: scripts/extract_standards.py — 손으로 고치지 말고 스크립트를 고쳐라.

courses:
  10통과1:
    name: 통합과학1
    type: 공통
    source: 지도서 고_통합과학1(신영준)_지도서_2쇄.pdf 총론 10~13쪽 (대조 - 각론 44~179쪽)
    note: ⑵ 물질과 규칙성의 성취기준 해설 절(지도서 12쪽)에 10통과1-01-06 이라는 코드가 한 번 나오는데, 실제로는 02-06(물질의 전기적 성질)의 해설이다. 지도서 오기로 보이지만 원문을 고쳐 적지 않고 나온 그대로 두었다 — 각론에 짝이 없어 미대조이며, **C5 태깅에 쓰지 마라.** 영역 01 의 실제 성취기준은 01-01~01-04 넷뿐이다. 나머지 16개는 총론(10~13쪽)과 각론(44~179쪽)이 일치한다.
    standards:
    - code: 10통과1-01-01
      area: '01'
      seq: '01'
      area_name: 과학의 기초
      text: 자연을 시간과 공간에서 기술할 수 있음을 알고, 길이와 시간 측정의 현대적 방법과 다양한 규모의 측정 사례를 조사할 수 있다.
      source_page: 10
      crosscheck: 일치
    - code: 10통과1-01-02
      area: '01'
      seq: '02'
      area_name: 과학의 기초
      text: 과학 탐구에서 중요한 기본량의 의미를 알고, 자연 현상을 기술하는 데 단위가 가지는 의미와 적용사례를 설명할 수 있다.
      source_page: 10
      crosscheck: 일치
    - code: 10통과1-01-03
      area: '01'
      seq: '03'
      area_name: 과학의 기초
      text: 과학 탐구에서 측정과 어림의 의미를 알고, 일상생활의 여러 가지 상황에서 측정 표준의 유용성과 필요성을 논증할 수 있다.
      source_page: 10
      crosscheck: 일치
    - code: 10통과1-01-04
      area: '01'
      seq: '04'
      area_name: 과학의 기초
      text: 자연에서 일어나는 다양한 변화를 측정·분석하여 정보를 산출함을 알고, 이러한 정보를 디지털로 변환하는 기술을 정보 통신에 활용하여 현대 문명에 미친 영향을 인식한다.
      source_page: 10
      crosscheck: 일치
    - code: 10통과1-01-06
      area: '01'
      seq: '06'
      area_name: 과학의 기초
      text: 유용하게 활용됨을 소개한다.
      source_page: 12
      crosscheck: 미대조
    - code: 10통과1-02-01
      area: '02'
      seq: '01'
      area_name: 물질과 규칙성
      text: 천체에서 방출되는 빛의 스펙트럼을 분석하여 우주 초기에 형성된 원소와 천체의 구성 물질을 추론할 수 있다.
      source_page: 11
      crosscheck: 일치
    - code: 10통과1-02-02
      area: '02'
      seq: '02'
      area_name: 물질과 규칙성
      text: 우주 초기의 원소들로부터 태양계의 재료이면서 생명체를 구성하는 원소들이 형성되는 과정을 통해 지구와 생명의 역사가 우주 역사의 일부분임을 해석할 수 있다.
      source_page: 11
      crosscheck: 일치
    - code: 10통과1-02-03
      area: '02'
      seq: '03'
      area_name: 물질과 규칙성
      text: 세상을 구성하는 원소들의 성질이 주기성을 나타내는 현상을 통해 자연의 규칙성을 도출하고, 지구와 생명체를 구성하는 주요 원소들이 결합을 형성하는 이유를 해석할 수 있다.
      source_page: 11
      crosscheck: 일치
    - code: 10통과1-02-04
      area: '02'
      seq: '04'
      area_name: 물질과 규칙성
      text: 인류의 생존에 필수적인 물, 산소, 소금 등이 만들어지는 결합의 차이를 이해하고 각 물질의 성질과 관련지어 설명할 수 있다.
      source_page: 11
      crosscheck: 일치
    - code: 10통과1-02-05
      area: '02'
      seq: '05'
      area_name: 물질과 규칙성
      text: 지각과 생명체를 구성하는 물질들이 기본 단위체의 결합을 통해서 형성된다는 것을 규산염 광물, 단백질과 핵산의 예를 통해 설명할 수 있다.
      source_page: 11
      crosscheck: 일치
    - code: 10통과1-02-06
      area: '02'
      seq: '06'
      area_name: 물질과 규칙성
      text: 지구를 구성하는 물질을 전기적 성질에 따라 구분할 수 있고, 물질의 전기적 성질을 응용하여 일상생활과 첨단기술에서 다양한 소재로 활용됨을 인식한다.
      source_page: 11
      crosscheck: 일치
    - code: 10통과1-03-01
      area: '03'
      seq: '01'
      area_name: 시스템과 상호작용
      text: 지구시스템은 태양계라는 시스템의 구성 요소임을 알고, 지구시스템을 구성하는 권역들 간의 물질 순환과 에너지 흐름의 결과로 나타나는 현상을 논증할 수 있다.
      source_page: 12
      crosscheck: 일치
    - code: 10통과1-03-02
      area: '03'
      seq: '02'
      area_name: 시스템과 상호작용
      text: 지권의 변화를 판구조론 관점에서 해석하고, 에너지 흐름의 결과로 발생하는 지권의 변화가 지구시스템에 미치는 영향을 추론할 수 있다.
      source_page: 12
      crosscheck: 일치
    - code: 10통과1-03-03
      area: '03'
      seq: '03'
      area_name: 시스템과 상호작용
      text: 중력의 작용으로 인한 지구 표면과 지구 주위의 다양한 운동을 설명할 수 있다.
      source_page: 12
      crosscheck: 일치
    - code: 10통과1-03-04
      area: '03'
      seq: '04'
      area_name: 시스템과 상호작용
      text: 상호작용이 없을 때 물체가 가속되지 않음을 알고, 충격량과 운동량의 관계를 충돌 관련 안전장치와 스포츠에 적용할 수 있다.
      source_page: 12
      crosscheck: 일치
    - code: 10통과1-03-05
      area: '03'
      seq: '05'
      area_name: 시스템과 상호작용
      text: 생명 시스템을 유지하기 위해서 다양한 화학 반응과 물질 출입이 필요함을 이해하고, 일상생활에서 활용되는 화학 반응 사례를 조사하여 발표할 수 있다.
      source_page: 12
      crosscheck: 일치
    - code: 10통과1-03-06
      area: '03'
      seq: '06'
      area_name: 시스템과 상호작용
      text: 생명 시스템의 유지에 필요한 세포 내 정보의 흐름을 유전자로부터 단백질이 만들어지는 과정을 중심으로 설명할 수 있다.
      source_page: 12
      crosscheck: 일치
  10통과2:
    name: 통합과학2
    type: 공통
    source: 지도서 총론 15~17쪽 (비상교육, 신영준 외)
    note: ⑵ 환경과 에너지의 여섯 코드는 총론 표에서 뒷자리가 모두 02-01 로 뭉개져 추출된다(폰트 인코딩 결함). 문장은 온전하고 순서도 분명해 나온 차례대로 02-01~02-06 을 매겼으나, **코드 자체를 원문에서 읽은 것이 아니다** — crosscheck 를 미대조로 두었다. 사람이 NCIC 원문으로 확정하기 전에는 C5 태깅에 쓰지 마라. 해설 절에서 02-01·02-04·02-05·02-06 은 눈으로 확인된다.
    standards:
    - code: 10통과2-01-01
      area: '01'
      seq: '01'
      area_name: 변화와 다양성
      text: 지질시대를 통해 지구 환경이 끊임없이 변화해 왔으며 이러한 환경 변화가 생물다양성에 미치는 영향을 추론할 수 있다.
      source_page: 15
      crosscheck: 일치
    - code: 10통과2-01-02
      area: '01'
      seq: '02'
      area_name: 변화와 다양성
      text: 변이의 발생과 자연선택 과정을 통해 생물의 진화가 일어나고, 진화의 과정을 통해 생물다 양성이 형성되었음을 추론할 수 있다.
      source_page: 15
      crosscheck: 일치
    - code: 10통과2-01-03
      area: '01'
      seq: '03'
      area_name: 변화와 다양성
      text: 자연과 인류의 역사에 큰 변화를 가져온 광합성, 화석 연료 사용, 철의 제련 등에서 공통점 을 찾아 산화와 환원을 이해하고, 생활 주변의 다양한 변화를 산화와 환원의 특징과 규칙성 으로 분석할 수 있다.
      source_page: 15
      crosscheck: 일치
    - code: 10통과2-01-04
      area: '01'
      seq: '04'
      area_name: 변화와 다양성
      text: 대표적인 산·염기 물질의 특징을 알고, 산과 염기를 혼합할 때 나타나는 중화 반응을 생활 속에서 이용할 수 있다.
      source_page: 15
      crosscheck: 일치
    - code: 10통과2-01-05
      area: '01'
      seq: '05'
      area_name: 변화와 다양성
      text: 생활 주변에서 에너지를 흡수하거나 방출하는 현상을 찾아 에너지의 흡수 방출이 우리 생 활에 어떻게 이용되는지 토의할 수 있다.
      source_page: 15
      crosscheck: 일치
    - code: 10통과2-02-01
      area: '02'
      seq: '01'
      area_name: 환경과 에너지
      text: 생태계구성요소를 이해하고 생물과 환경 사이의 상호 관계를 설명할 수 있다.
      source_page: 16
      crosscheck: 미대조
    - code: 10통과2-02-02
      area: '02'
      seq: '02'
      area_name: 환경과 에너지
      text: 먹이 관계와 생태 피라미드를 중심으로 생태계 평형이 유지되는 과정을 이해하고, 환경의 변화가 생태계에 미칠 수 있는 영향에 대해 협력적으로 소통할 수 있다.
      source_page: 16
      crosscheck: 미대조
    - code: 10통과2-02-03
      area: '02'
      seq: '03'
      area_name: 환경과 에너지
      text: 온실효과 강화로 인한 지구온난화의 메커니즘을 이해하고, 엘니뇨, 사막화 등과 같은 현상 이 지구 환경과 인간 생활에 미치는 영향과 대처 방안을 분석할 수 있다.
      source_page: 16
      crosscheck: 미대조
    - code: 10통과2-02-04
      area: '02'
      seq: '04'
      area_name: 환경과 에너지
      text: 태양에서 수소 핵융합 반응을 통해 질량 일부가 에너지로 바뀌고, 그중 일부가 지구에서 에 너지 흐름을 일으키며 다양한 에너지로 전환되는 과정을 추론할 수 있다.
      source_page: 16
      crosscheck: 미대조
    - code: 10통과2-02-05
      area: '02'
      seq: '05'
      area_name: 환경과 에너지
      text: 발전기에서 운동 에너지가 전기 에너지로 전환되는 과정을 이해하고, 열원으로서 화석 연 료, 핵에너지를 이용하는 발전소가 인간 생활에 미치는 영향을 조사·발표 할 수 있다.
      source_page: 16
      crosscheck: 미대조
    - code: 10통과2-02-06
      area: '02'
      seq: '06'
      area_name: 환경과 에너지
      text: 에너지 효율의 의미와 중요성을 이해하고, 지속가능한 발전과 지구 환경 문제 해결에 신재 생 에너지 기술을 활용하는 방안을 탐색할 수 있다.
      source_page: 16
      crosscheck: 미대조
    - code: 10통과2-03-01
      area: '03'
      seq: '01'
      area_name: 과학과 미래 사회
      text: 감염병의 진단, 추적 등을 사례로 과학의 유용성을 설명하고, 미래 사회 문제 해결에서 과 학의 필요성에 대해 논증할 수 있다.
      source_page: 17
      crosscheck: 일치
    - code: 10통과2-03-02
      area: '03'
      seq: '02'
      area_name: 과학과 미래 사회
      text: 빅데이터를 과학기술사회에서 사용하고 있는 사례를 조사하고, 빅데이터 활용의 장점과 문 제점을 추론할 수 있다.
      source_page: 17
      crosscheck: 일치
    - code: 10통과2-03-03
      area: '03'
      seq: '03'
      area_name: 과학과 미래 사회
      text: 인공지능 로봇, 사물인터넷 등과 같이 과학기술의 발전을 인간 삶과 환경 개선에 활용하는 사례를 찾고, 이러한 과학기술의 발전이 미래 사회에 미치는 유용성과 한계를 예측할 수 있 다.
      source_page: 17
      crosscheck: 일치
    - code: 10통과2-03-04
      area: '03'
      seq: '04'
      area_name: 과학과 미래 사회
      text: 과학기술의 발전 과정에서 발생할 수 있는 과학 관련 사회적 쟁점(SSI)과 과학기술 이용에 서 과학 윤리의 중요성에 대해 논증할 수 있다.
      source_page: 17
      crosscheck: 일치
