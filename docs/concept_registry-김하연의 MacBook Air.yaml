# 개념 키 사전 (공용 자산 · ★사람 관리)
#
# concept_key 는 이 플랫폼의 통합 근거다. 개념 카드의 same 링크와
# SciMetro 노선의 환승역이 **같은 장치**이며, 둘 다 이 사전 위에 선다.
# 사전이 두 벌이면 통합의 실익이 전부 사라진다 (Sci_Map §0.2).
#
# ⚠️ 등록 규칙 — 우회 금지
#   신규 키는 어느 계열에서 제안하든 **G3 사람 게이트**를 통과해야 여기 들어온다.
#   에이전트는 이 파일을 직접 쓰지 않는다. 제안은
#   /output/graph/<batch>.proposed_keys.yaml 에 쌓고, 승인된 것만 사람이 옮긴다.
#
# 키 형식: concept:<kebab-case-english>
#   - 영어 기반 — 한글 표기가 바뀌어도(부탄→뷰테인) 키는 안 흔들린다
#   - 동음이의는 한정어를 붙여 가른다 (concept:atomic-nucleus / concept:cell-nucleus)
#   - homonyms.yaml 의 surface_form 에 걸리는 개념은 반드시 한정어를 붙인다

