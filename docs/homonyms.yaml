# 동음이의 금지쌍 — ★공용 자산 (Sci_Map §0.3, R9)
#
# 표기가 같아도 개념이 다르면 **절대 같은 concept_key 를 주지 않는다.**
# 개념 링크(`same`)와 노선 환승은 표기 일치가 아니라 concept_key 일치로만 건다.
# 이 파일은 "이 낱말이 보이면 멈추고 어느 쪽인지 확인하라"는 경고 목록이다.
#
# ★ 사람 관리 파일이다. 어느 계열에서 제안하든 **사람 승인 없이 갱신하지 않는다**
#   (CLAUDE.md §9-3). 스크립트는 읽기만 한다.

version: 1

# 파이프라인이 이 낱말을 표제어나 링크 후보로 만나면 경고를 띄운다.
watch_terms:
  - term: 주기
    reason: 주기율표의 가로줄 ↔ 진동·파동의 되풀이 시간. 과목이 갈리면 거의 확실히 다른 개념이다
    senses:
      - {key: "concept:periodic-table-period", gloss: "주기율표에서 같은 전자 껍질 수를 갖는 원소들의 가로줄", subject: 화학}
      - {key: "concept:oscillation-period",    gloss: "진동·파동이 한 번 되풀이되는 데 걸리는 시간", subject: 물리학}

  - term: 핵
    reason: 원자핵 ↔ 세포핵 ↔ 응결핵. 셋 다 고등학교 과정에 나온다
    senses:
      - {key: "concept:atomic-nucleus",  gloss: "양성자와 중성자로 이루어진 원자의 중심부", subject: 화학}
      - {key: "concept:cell-nucleus",    gloss: "진핵세포에서 유전물질을 담고 있는 세포소기관", subject: 생명과학}
      - {key: "concept:condensation-nucleus", gloss: "수증기가 응결할 때 중심이 되는 미세 입자", subject: 지구과학}

  - term: 전위
    reason: 전기 퍼텐셜 ↔ 지층의 자리바꿈. 표기가 같을 뿐 아무 관계가 없다
    senses:
      - {key: "concept:electric-potential", gloss: "단위 전하가 갖는 전기 퍼텐셜 에너지", subject: 물리학}
      - {key: "concept:dislocation",        gloss: "결정 안 원자 배열의 어긋남", subject: 화학}

  - term: 일
    reason: 물리학의 일(W=Fs) ↔ 일상어. 낱말이 짧아 오탐이 잦으니 링크 후보에서 특히 조심한다
    senses:
      - {key: "concept:work-physics", gloss: "힘이 물체를 옮긴 거리에 곱해진 양", subject: 물리학}

  - term: 계
    reason: 열역학의 계(system) ↔ 태양계·생태계 등의 접미사. 접미사로 쓰인 것을 개념으로 잡지 않는다
    senses:
      - {key: "concept:thermodynamic-system", gloss: "주위와 구분해 살피는 대상 영역", subject: 화학}

  - term: 상
    reason: 물질의 상(phase) ↔ 광학의 상(image). 물질과 에너지 단원에서 자주 나온다
    senses:
      - {key: "concept:phase-matter", gloss: "기체·액체·고체처럼 물리적 성질이 균일한 부분", subject: 화학}
      - {key: "concept:optical-image", gloss: "렌즈·거울이 만드는 물체의 상", subject: 물리학}

# 링크를 걸 때의 규칙 (R9)
rules:
  - watch_terms 에 있는 낱말은 **표기 일치만으로 `same` 링크를 걸지 않는다**
  - 어느 sense 인지 단정할 수 없으면 `uncertain` 으로 두고 G2 를 거쳐 G3 사람 게이트로 올린다
  - 새 sense 를 발견하면 여기에 **제안**만 하고, 등록은 사람이 한다
