# 교사 보유 오개념 목록 (사람 관리)
#
# C2 카드 작성 시 이 파일에 해당 개념이 있으면 **우선 사용**한다 (source: "teacher").
# 없으면 LLM 이 생성하되 source: "llm" 으로 표시하고, C8 게이트에서 우선 검토 대상이 된다.
# C10 학습 로그 분석이 실제 오답 분포에서 발견한 항목은 source: "log" 로 제안된다.
#
# 오개념은 데일리 문항의 **거짓 OX 지문 원천**이다. 여기 잘못된 항목이 들어가면
# 학생에게 오개념을 심는다. 그래서 사람이 관리한다.

