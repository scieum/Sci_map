# 오개념 목록 — misconceptions.yaml
#
# ★사람(교사) 관리 파일이다. 현장에서 실제로 본 오답이 이 앱의 가장 큰 차별점이다
#   (설계서 §10.3). LLM 이 지어낸 오답보다 정확도가 높다.
#
# C2 는 여기 해당 개념이 있으면 **우선 사용**하고, 없으면 생성하되
# `source: "llm"` 으로 표시한다. llm 표시된 것은 C8 게이트에서 우선 검토 대상이다.
#
# ── 형식 ────────────────────────────────────────────────────────────────────
#   concept_key: 오개념이 붙을 개념 (concept_registry.yaml 의 키)
#   items[].text:      학생이 실제로 하는 틀린 말. **틀린 문장 그대로** 적는다.
#   items[].why_wrong: 왜 틀렸는지. 학생이 읽고 납득할 문장으로.
#   items[].seen_in:   어디서 봤는지 (선택) — 수업·시험·오답 로그
#
# 잘 쓰는 요령: "학생이 자주 틀린다"가 아니라 **학생이 실제로 쓴 문장**을 적어라.
# 그 문장이 그대로 OX 오답 지문이 된다 (§2.4).

version: 1
updated: 2026-09-05

concepts: []

