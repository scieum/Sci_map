# 단원 백로그 — [A] 개념 파이프라인(C0~C10)의 실행 단위 목록
#
# 실행 단위 = 단원 1개 (Sci_Map §4.1). 한 사이클이 카드 10~30장을 낳고,
# 교사 게이트(C8)가 한 번에 감당하는 분량이 그 정도다.
# 그래서 대단원(영역)이 아니라 성취기준 2~3개 묶음을 한 단원으로 잡는다.
#
# status: pending | in_progress | gated | deployed | blocked
# blocked_on: 진행 불가 사유 (해소되어야 status가 pending으로 돌아간다)
#
# ⚠️ 전 단원이 blocked 상태다. C0(교과서 전처리)의 입력인
#    /inbox/textbook/*.pdf 가 비어 있다. 교과서 PDF 투입 전에는
#    C0 이후 어느 단계도 시작할 수 없다.

