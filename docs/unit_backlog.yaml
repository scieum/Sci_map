- code: cell
  name: 세포와 물질대사
  course_type: 진로선택
  grade: null
  curriculum: 2022 개정
  # 지도서 24~26쪽의 성취기준 코드 27개가 모두 [12세포NN-NN] 꼴이다 (영역 01·02·03).
  standard_prefix: 12세포
  textbook:
    file: inbox/textbook/22개정/생명과학/고_세포와물질대사(이준규)_교과서_2쇄.pdf
    publisher: 천재교과서
    author: 이준규 외 4인
    pages: 140
    note: >-
      ★publisher 는 2026-09-10 교사가 확정했다 — 천재교과서. 교과서·지도서 어느 쪽에서도
      발행처가 텍스트로 뽑히지 않아(판권 쪽이 이미지) 에이전트는 단정하지 않고 미확인으로
      두었던 자리다. 쪽 번호가 세 자리(008)인 것은 천재 판형과 맞고, PDF Creator 가
      비상교육 책과 같은 Prinect 인 것은 인쇄 공정이라 발행처 근거가 아니었다.
      rights/ledger.jsonl 의 holder 는 이 값에서 온다.

      인쇄 쪽수 == PDF 쪽수 (p8 '008 I. 세포', p11 '단원 펼쳐보기 011' 러닝헤드로 확인).
      쪽 번호는 세 자리다. 앞부속 p1~7, 부록 p126~140 은 본문이 아니다.

      ★이 판형의 위계는 대단원 > 중단원(01~) > 소주제(1~) 로, 천재교과서와 번호 자리가
      뒤바뀌어 있다(천재는 중단원이 1~, 소주제가 01~). numeral 은 책에 찍힌 대로 적었다.

      ★중단원 11개마다 개념 정리 쪽이 하나씩 있고('정답 ➊' 로 시작하는 답 줄이 표지다),
      전량 스캔해 11쪽(21·27·37·45·63·73·89·97·103·115·119)을 확정했다. 중단원 수와
      정확히 일치한다.

      ★소주제 마지막 쪽과 정리 쪽 사이에 '세로처럼 깊게 가로처럼 넓게' 읽기 면이
      끼는 중단원이 11개 중 4개 있다 (cell-1-1 p20, cell-2-2 p72, cell-3-1 p88,
      cell-3-4 p113~114). 천재 판형에는 없던 자리라 split_unit.py 의 "마지막 소주제
      다음 쪽이 곧 정리 쪽" 가정을 2쪽까지 벌어질 수 있게 넓혔다. 벌어진 쪽은 건너뛰지
      않고 role=body 로 남는다.

      ★2026-09-10 교사 결정: cell-1·cell-3 추출률 94.8%(기준 95%) 미달을 수용하고 넘어간다.
      cell-2 는 95.4% 로 통과했다.
      텍스트 없는 쪽 0쪽, 80% 미만으로 뒤처지는 쪽 0쪽 — 손실이 44쪽에 고르게 퍼져
      있어 특정 쪽이 실패한 것이 아니다. 통합과학1·2(2026-09-08)와 같은 사유다.

      ★extras 의 project 는 단원 끝의 '미래 시민/민주 시민/생태 시민' 두 쪽 면이다.
      읽기 + '함께 해 봐요!' 활동으로 짜여 있어 project 자리에 넣었다. 카드 원천이
      아니라는 표시가 목적이고, 이름이 정확해서 고른 것은 아니다.
