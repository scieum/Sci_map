  #   통합과학1은 [10통과1-01-01] 꼴로 보이나 원문 대조 전이다.
  standard_prefix: 10통과1
  textbook:
    file: inbox/textbook/22개정/통합과학/고_통합과학1(신영준)_교과서_2쇄.pdf
    publisher: 비상교육
    author: 신영준 외
    pages: 186
    note: >-
      인쇄 쪽수 == PDF 쪽수 (p10·11·38·98·162 러닝헤드로 확인). 앞부속(p1~9)·
      부록(p162~186)은 본문이 아니다. 단원·중단원 경계는 짝수 쪽의 단원 러닝헤드와
      홀수 쪽의 중단원 러닝헤드를 186쪽 전량 스캔해 확정했다.
      추출률: Ⅰ 95.1% 통과 / Ⅱ 94.1% 미달 / Ⅲ 94.9% 미달. 텍스트 없는 쪽은 0쪽.
      통합과학2(Ⅱ단원 94.7%)와 같은 원인 — 말풍선·손글씨체 디자인 텍스트가 많은
      비상교육 판형이다.
      ★이 판형에는 글리프 이중 조판 쪽이 있다 — 전면 사진·색면 쪽에서 글자가 두 번
      찍혀 '40' 이 '4400', '지구시스템' 이 '지지구구시시스스템템' 으로 뽑힌다.
      본문 152쪽 중 17쪽(11%)이 그렇다. split_unit 의 쪽번호·제목 대조가 이 때문에
      Ⅱ에서 1건, Ⅲ에서 3건 불일치를 냈다(중복 제거하면 모두 일치).
      ★2026-09-08 교사 결정: 이 에스컬레이션을 수용하고 넘어간다. 검출기를 고치지도,
      경계를 자동 보정하지도 않는다 — 선언된 경계를 그대로 쓴다. 근거는 186쪽
      러닝헤드 전량 스캔이고, 추출률 미달은 통합과학2 선례와 같은 판형 사유다.
      나중에 이 판형을 다시 다룰 때는 _common.clean() 의 이중 글리프 처리부터 보라.
