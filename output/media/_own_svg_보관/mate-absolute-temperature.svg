<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320"
     font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <title>절대 온도 — 섭씨온도와 시작점만 273 어긋나 있고 눈금 한 칸의 크기는 같다</title>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#6b7684"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#20242b">두 눈금은 시작점만 273 어긋나 있다 — 한 칸의 크기는 같다</text>

  <!-- 100 K 구간 표시 -->
  <text x="375" y="56" text-anchor="middle" font-size="12" fill="#0e82c4">100 K 구간</text>
  <path d="M300 74 L300 64 L450 64 L450 74" fill="none" stroke="#0e82c4" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- 절대 온도 눈금 -->
  <g font-size="12" fill="#6b7684" text-anchor="middle">
    <text x="150" y="86">0</text>
    <text x="300" y="86">100</text>
    <text x="450" y="86">200</text>
    <text x="600" y="86">300</text>
    <text x="750" y="86">400</text>
  </g>
  <line x1="150" y1="100" x2="750" y2="100" stroke="#0e82c4" stroke-width="2" stroke-linecap="round"/>
  <g stroke="#0e82c4" stroke-width="1">
    <line x1="187.5" y1="100" x2="187.5" y2="96"/><line x1="225" y1="100" x2="225" y2="96"/>
    <line x1="262.5" y1="100" x2="262.5" y2="96"/><line x1="337.5" y1="100" x2="337.5" y2="96"/>
    <line x1="375" y1="100" x2="375" y2="96"/><line x1="412.5" y1="100" x2="412.5" y2="96"/>
    <line x1="487.5" y1="100" x2="487.5" y2="96"/><line x1="525" y1="100" x2="525" y2="96"/>
    <line x1="562.5" y1="100" x2="562.5" y2="96"/><line x1="637.5" y1="100" x2="637.5" y2="96"/>
    <line x1="675" y1="100" x2="675" y2="96"/><line x1="712.5" y1="100" x2="712.5" y2="96"/>
  </g>
  <g stroke="#0e82c4" stroke-width="2">
    <line x1="150" y1="100" x2="150" y2="92"/><line x1="300" y1="100" x2="300" y2="92"/>
    <line x1="450" y1="100" x2="450" y2="92"/><line x1="600" y1="100" x2="600" y2="92"/>
    <line x1="750" y1="100" x2="750" y2="92"/>
  </g>
  <text x="142" y="104" text-anchor="end" font-size="13" font-weight="600" fill="#0e82c4">절대 온도 (K)</text>

  <!-- 두 눈금을 잇는 선 -->
  <g stroke="#6b7684" stroke-width="1" stroke-dasharray="4 4">
    <line x1="559.5" y1="100" x2="559.5" y2="190"/>
    <line x1="709.5" y1="100" x2="709.5" y2="190"/>
  </g>

  <!-- 어긋난 양 -->
  <text x="356" y="142" text-anchor="middle" font-size="13" fill="#6b7684">273 만큼 어긋나 있다 · T(K) = t(℃) + 273</text>
  <line x1="153" y1="152" x2="557" y2="152" stroke="#6b7684" stroke-width="1.5"
        marker-start="url(#ag)" marker-end="url(#ag)"/>
  <text x="568" y="178" font-size="12" fill="#6b7684">0 ℃ = 273 K</text>

  <!-- 0 K 아래가 없음을 나타내는 벽 -->
  <line x1="150" y1="88" x2="150" y2="200" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#d97706" stroke-width="1.5" stroke-linecap="round">
    <line x1="150" y1="104" x2="138" y2="114"/>
    <line x1="150" y1="128" x2="138" y2="138"/>
    <line x1="150" y1="152" x2="138" y2="162"/>
    <line x1="150" y1="176" x2="138" y2="186"/>
  </g>

  <!-- 섭씨온도 눈금 -->
  <line x1="150" y1="190" x2="750" y2="190" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <g stroke="#dc2626" stroke-width="1">
    <line x1="184.5" y1="190" x2="184.5" y2="194"/><line x1="222" y1="190" x2="222" y2="194"/>
    <line x1="297" y1="190" x2="297" y2="194"/><line x1="334.5" y1="190" x2="334.5" y2="194"/>
    <line x1="372" y1="190" x2="372" y2="194"/><line x1="447" y1="190" x2="447" y2="194"/>
    <line x1="484.5" y1="190" x2="484.5" y2="194"/><line x1="522" y1="190" x2="522" y2="194"/>
    <line x1="597" y1="190" x2="597" y2="194"/><line x1="634.5" y1="190" x2="634.5" y2="194"/>
    <line x1="672" y1="190" x2="672" y2="194"/><line x1="747" y1="190" x2="747" y2="194"/>
  </g>
  <g stroke="#dc2626" stroke-width="2">
    <line x1="150" y1="190" x2="150" y2="198"/><line x1="259.5" y1="190" x2="259.5" y2="198"/>
    <line x1="409.5" y1="190" x2="409.5" y2="198"/><line x1="559.5" y1="190" x2="559.5" y2="198"/>
    <line x1="709.5" y1="190" x2="709.5" y2="198"/>
  </g>
  <g font-size="12" fill="#6b7684" text-anchor="middle">
    <text x="150" y="212">-273</text>
    <text x="259.5" y="212">-200</text>
    <text x="409.5" y="212">-100</text>
    <text x="559.5" y="212">0</text>
    <text x="709.5" y="212">100</text>
  </g>
  <text x="142" y="194" text-anchor="end" font-size="13" font-weight="600" fill="#dc2626">섭씨온도 (℃)</text>

  <!-- 100 ℃ 구간 표시 -->
  <path d="M409.5 232 L409.5 242 L559.5 242 L559.5 232" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="484.5" y="258" text-anchor="middle" font-size="12" fill="#dc2626">100 ℃ 구간</text>

  <text x="400" y="282" text-anchor="middle" font-size="13" fill="#6b7684">두 구간의 길이가 같다 — 온도 차이를 말할 때는 K와 ℃의 값이 서로 같다</text>
  <text x="400" y="304" text-anchor="middle" font-size="13" fill="#6b7684">0 K보다 낮은 온도는 없어 절대 온도는 음수가 되지 않는다 · 기체 법칙에는 반드시 K를 넣는다</text>
</svg>
