<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360"
     font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <title>비결정성 고체 — 입자 배열에 규칙이 없어 인력의 크기가 자리마다 다르고, 그 때문에 녹는점이 한 점으로 정해지지 않고 넓은 온도 구간에 걸쳐 물러진다</title>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="24" y="27" font-size="17" font-weight="700" fill="#20242b">비결정성 고체 — 불규칙 배열이 흐려 놓는 녹는점</text>

  <!-- 패널 1: 불규칙 배열 (결정성 고체 그림과 같은 자리) -->
  <rect x="24" y="44" width="364" height="200" rx="12" fill="none" stroke="#edf0f4" stroke-width="1.5"/>
  <text x="206" y="66" font-size="15" font-weight="600" fill="#20242b" text-anchor="middle">① 불규칙 배열</text>

  <g fill="#dc2626">
    <circle cx="76" cy="104" r="9"/><circle cx="122" cy="124" r="9"/><circle cx="166" cy="98" r="9"/>
    <circle cx="212" cy="118" r="9"/><circle cx="258" cy="100" r="9"/><circle cx="302" cy="122" r="9"/>
    <circle cx="344" cy="104" r="9"/>
    <circle cx="92" cy="158" r="9"/><circle cx="140" cy="146" r="9"/><circle cx="184" cy="168" r="9"/>
    <circle cx="230" cy="144" r="9"/><circle cx="274" cy="164" r="9"/><circle cx="318" cy="150" r="9"/>
    <circle cx="352" cy="172" r="9"/>
    <circle cx="72" cy="200" r="9"/><circle cx="116" cy="186" r="9"/><circle cx="162" cy="206" r="9"/>
    <circle cx="208" cy="188" r="9"/><circle cx="254" cy="204" r="9"/><circle cx="300" cy="192" r="9"/>
    <circle cx="340" cy="210" r="9"/>
  </g>
  <text x="206" y="234" font-size="13" fill="#6b7684" text-anchor="middle">예) 유리 — 줄도 칸도 맞지 않아 규칙이 없다</text>

  <!-- 패널 2: 가열 곡선 (결정성 고체 그림과 같은 축) -->
  <rect x="412" y="44" width="364" height="200" rx="12" fill="none" stroke="#edf0f4" stroke-width="1.5"/>
  <text x="594" y="66" font-size="15" font-weight="600" fill="#20242b" text-anchor="middle">② 넓은 구간에 걸쳐 물러진다</text>

  <rect x="460" y="124" width="300" height="48" fill="#f3f5f8"/>
  <g stroke="#dc2626" stroke-width="1" stroke-dasharray="4 4">
    <line x1="460" y1="124" x2="760" y2="124"/>
    <line x1="460" y1="172" x2="760" y2="172"/>
  </g>
  <line x1="480" y1="168" x2="480" y2="128" stroke="#dc2626" stroke-width="1.5"
        marker-start="url(#r)" marker-end="url(#r)"/>
  <text x="494" y="148" font-size="12" fill="#dc2626" dominant-baseline="middle">물러지는 구간</text>

  <line x1="460" y1="214" x2="460" y2="88" stroke="#0e82c4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="460" y1="214" x2="760" y2="214" stroke="#0e82c4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="460" y="80" font-size="12" fill="#6b7684" text-anchor="middle">온도</text>
  <text x="760" y="232" font-size="12" fill="#6b7684" text-anchor="end">가열 시간</text>

  <polyline points="460,206 520,188 560,172 620,158 665,142 690,124 760,96" fill="none" stroke="#dc2626" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
  <text x="470" y="104" font-size="13" fill="#6b7684">평평한 구간이 없다</text>

  <!-- 패널 3: 화학식은 같고 배열이 다르다 -->
  <text x="400" y="268" font-size="15" font-weight="600" fill="#20242b" text-anchor="middle">같은 SiO<tspan dy="4" font-size="11">2</tspan><tspan dy="-4">, 다른 배열</tspan></text>

  <rect x="24" y="280" width="360" height="60" rx="8" fill="none" stroke="#189fe6" stroke-width="1.5"/>
  <g fill="#189fe6">
    <circle cx="46" cy="298" r="6"/><circle cx="68" cy="298" r="6"/><circle cx="90" cy="298" r="6"/><circle cx="112" cy="298" r="6"/>
    <circle cx="46" cy="320" r="6"/><circle cx="68" cy="320" r="6"/><circle cx="90" cy="320" r="6"/><circle cx="112" cy="320" r="6"/>
  </g>
  <text x="134" y="304" font-size="15" font-weight="600" fill="#20242b">석영 · 결정성 고체</text>
  <text x="134" y="326" font-size="13" fill="#6b7684">규칙적 배열 → 녹는점 일정</text>

  <rect x="416" y="280" width="360" height="60" rx="8" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <g fill="#dc2626">
    <circle cx="442" cy="300" r="6"/><circle cx="468" cy="292" r="6"/><circle cx="492" cy="308" r="6"/><circle cx="514" cy="296" r="6"/>
    <circle cx="446" cy="324" r="6"/><circle cx="470" cy="318" r="6"/><circle cx="496" cy="328" r="6"/><circle cx="516" cy="316" r="6"/>
  </g>
  <text x="536" y="304" font-size="15" font-weight="600" fill="#20242b">유리 · 비결정성 고체</text>
  <text x="536" y="326" font-size="13" fill="#6b7684">불규칙 배열 → 넓은 구간</text>
</svg>
