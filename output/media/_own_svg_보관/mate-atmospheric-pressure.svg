<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400"
     font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <title>대기압 — 대기압이 클수록 액체 기둥은 높아지고, 액체의 밀도가 클수록 기둥은 낮아진다</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#189fe6"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#dc2626"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#6b7684"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#20242b">대기압은 액체 기둥의 무게와 균형을 이룬다</text>

  <line x1="398" y1="44" x2="398" y2="372" stroke="#edf0f4" stroke-width="2"/>

  <!-- 왼쪽 : 대기압이 다를 때 -->
  <text x="207" y="64" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">대기압이 크면 기둥이 높다</text>
  <text x="207" y="84" text-anchor="middle" font-size="12" fill="#6b7684">같은 수은 기둥, 대기압만 다르다</text>

  <line x1="40" y1="330" x2="374" y2="330" stroke="#6b7684" stroke-width="2" stroke-linecap="round"/>
  <text x="44" y="348" font-size="12" fill="#6b7684">액면</text>

  <text x="122" y="142" text-anchor="middle" font-size="12" fill="#6b7684">진공</text>
  <rect x="100" y="150" width="44" height="180" rx="2" fill="#189fe6" stroke="#0e82c4" stroke-width="1.5"/>
  <text x="152" y="244" font-size="13" font-weight="600" fill="#20242b">760 mm</text>
  <line x1="76" y1="268" x2="76" y2="326" stroke="#189fe6" stroke-width="3" marker-end="url(#a)"/>
  <text x="76" y="258" text-anchor="middle" font-size="13" font-weight="600" fill="#189fe6">1 atm</text>
  <text x="122" y="366" text-anchor="middle" font-size="13" fill="#6b7684">해수면</text>

  <text x="272" y="197" text-anchor="middle" font-size="12" fill="#6b7684">진공</text>
  <rect x="250" y="205" width="44" height="125" rx="2" fill="#189fe6" stroke="#0e82c4" stroke-width="1.5"/>
  <text x="302" y="272" font-size="13" font-weight="600" fill="#20242b">530 mm</text>
  <line x1="226" y1="286" x2="226" y2="326" stroke="#dc2626" stroke-width="3" marker-end="url(#ar)"/>
  <text x="226" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">0.7 atm</text>
  <text x="272" y="366" text-anchor="middle" font-size="13" fill="#6b7684">높은 산 위</text>

  <!-- 오른쪽 : 액체가 다를 때 -->
  <text x="593" y="64" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">밀도가 크면 기둥이 낮다</text>
  <text x="593" y="84" text-anchor="middle" font-size="12" fill="#6b7684">같은 1 atm, 액체만 다르다</text>

  <line x1="420" y1="330" x2="776" y2="330" stroke="#6b7684" stroke-width="2" stroke-linecap="round"/>

  <rect x="470" y="150" width="44" height="180" rx="2" fill="#189fe6" stroke="#0e82c4" stroke-width="1.5"/>
  <text x="522" y="244" font-size="13" font-weight="600" fill="#20242b">760 mm</text>
  <text x="492" y="348" text-anchor="middle" font-size="13" font-weight="600" fill="#20242b">수은</text>
  <text x="492" y="366" text-anchor="middle" font-size="12" fill="#6b7684">밀도 13.6 g/mL</text>

  <rect x="650" y="110" width="44" height="62" fill="#dc2626" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="650" y="190" width="44" height="140" fill="#dc2626" stroke="#dc2626" stroke-width="1.5"/>
  <polyline points="650,172 661,164 672,180 683,164 694,172" fill="none" stroke="#dc2626" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="650,190 661,182 672,198 683,182 694,190" fill="none" stroke="#dc2626" stroke-width="2" stroke-linejoin="round"/>
  <text x="700" y="240" font-size="13" font-weight="600" fill="#20242b">약 10.3 m</text>
  <text x="700" y="258" font-size="12" fill="#6b7684">13.6배</text>
  <text x="672" y="348" text-anchor="middle" font-size="13" font-weight="600" fill="#20242b">물</text>
  <text x="672" y="366" text-anchor="middle" font-size="12" fill="#6b7684">밀도 1.0 g/mL</text>

  <line x1="444" y1="268" x2="444" y2="326" stroke="#6b7684" stroke-width="3" marker-end="url(#ag)"/>
  <text x="444" y="258" text-anchor="middle" font-size="12" fill="#6b7684">1 atm</text>
  <line x1="624" y1="268" x2="624" y2="326" stroke="#6b7684" stroke-width="3" marker-end="url(#ag)"/>
  <text x="624" y="258" text-anchor="middle" font-size="12" fill="#6b7684">1 atm</text>
  <text x="702" y="196" font-size="11" fill="#6b7684">(중간 생략)</text>

  <text x="400" y="388" text-anchor="middle" font-size="13" fill="#6b7684">같은 압력을 떠받치려면 밀도가 작은 액체일수록 더 높이 쌓여야 한다</text>
</svg>
