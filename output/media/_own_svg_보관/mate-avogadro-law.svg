<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400"
     font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <title>아보가드로 법칙 — 온도와 압력이 같으면 같은 부피 속 분자 수가 같고, 부피는 양(mol)에 비례한다</title>
  <defs>
    <g id="mh2">
      <circle cx="-5" cy="0" r="5"/><circle cx="5" cy="0" r="5"/>
    </g>
    <g id="mo2">
      <circle cx="-8" cy="0" r="8"/><circle cx="8" cy="0" r="8"/>
    </g>
    <g id="mch4">
      <circle cx="0" cy="0" r="8"/>
      <circle cx="-12" cy="-8" r="4"/><circle cx="12" cy="-8" r="4"/>
      <circle cx="-12" cy="8" r="4"/><circle cx="12" cy="8" r="4"/>
    </g>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#20242b">온도와 압력이 같으면, 부피가 같은 기체 속 분자 수도 같다</text>

  <text x="170" y="50" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">수소 H<tspan dy="4" font-size="11">2</tspan></text>
  <text x="400" y="50" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">산소 O<tspan dy="4" font-size="11">2</tspan></text>
  <text x="630" y="50" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">메테인 CH<tspan dy="4" font-size="11">4</tspan></text>

  <rect x="70" y="58" width="200" height="120" rx="12" fill="#eff9ff" stroke="#0e82c4" stroke-width="2"/>
  <rect x="300" y="58" width="200" height="120" rx="12" fill="#eff9ff" stroke="#0e82c4" stroke-width="2"/>
  <rect x="530" y="58" width="200" height="120" rx="12" fill="#eff9ff" stroke="#0e82c4" stroke-width="2"/>

  <g fill="#189fe6">
    <use href="#mh2" x="112" y="90"/><use href="#mh2" x="172" y="84"/><use href="#mh2" x="230" y="102"/>
    <use href="#mh2" x="122" y="144"/><use href="#mh2" x="182" y="152"/><use href="#mh2" x="236" y="142"/>
  </g>
  <g fill="#0e82c4">
    <use href="#mo2" x="342" y="90"/><use href="#mo2" x="402" y="84"/><use href="#mo2" x="460" y="102"/>
    <use href="#mo2" x="352" y="144"/><use href="#mo2" x="412" y="152"/><use href="#mo2" x="466" y="142"/>
  </g>
  <g fill="#7ccfff" stroke="#0e82c4" stroke-width="1.5">
    <use href="#mch4" x="572" y="90"/><use href="#mch4" x="632" y="84"/><use href="#mch4" x="690" y="102"/>
    <use href="#mch4" x="582" y="144"/><use href="#mch4" x="642" y="152"/><use href="#mch4" x="696" y="142"/>
  </g>

  <text x="170" y="196" text-anchor="middle" font-size="13" fill="#6b7684">분자 6개</text>
  <text x="400" y="196" text-anchor="middle" font-size="13" fill="#6b7684">분자 6개</text>
  <text x="630" y="196" text-anchor="middle" font-size="13" fill="#6b7684">분자 6개</text>

  <rect x="24" y="212" width="752" height="36" rx="8" fill="#def2ff"/>
  <text x="400" y="235" text-anchor="middle" font-size="13" fill="#20242b">0 ℃, 1 atm에서 부피가 같으면 종류가 달라도 분자 수가 같다 · 1 mol이 차지하는 부피는 22.4 L</text>

  <text x="24" y="276" font-size="15" font-weight="600" fill="#20242b">양(mol)이 늘면 부피도 같은 비율로 늘어난다 (온도 · 압력 일정)</text>

  <g font-size="13" fill="#6b7684" text-anchor="end">
    <text x="132" y="303">1 mol</text>
    <text x="132" y="335">2 mol</text>
    <text x="132" y="367">3 mol</text>
  </g>
  <rect x="140" y="290" width="180" height="18" rx="6" fill="#189fe6"/>
  <rect x="140" y="322" width="360" height="18" rx="6" fill="#189fe6"/>
  <rect x="140" y="354" width="540" height="18" rx="6" fill="#189fe6"/>
  <g font-size="12" fill="#6b7684">
    <text x="330" y="303">22.4 L</text>
    <text x="510" y="335">44.8 L</text>
    <text x="690" y="367">67.2 L</text>
  </g>
</svg>
