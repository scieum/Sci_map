<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400"
     font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <title>끓는점 — 같은 액체라도 외부 압력이 낮아지면 증기 압력이 더 낮은 온도에서 외부 압력과 같아져 끓는점이 낮아진다</title>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#6b7684"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#20242b">끓는점 — 외부 압력이 낮아지면 끓는점도 낮아진다</text>
  <text x="400" y="52" text-anchor="middle" font-size="13" fill="#6b7684">증기 압력이 외부 압력과 같아지는 온도가 끓는점이다 (물의 증기 압력 곡선)</text>

  <!-- 축 -->
  <line x1="90" y1="330" x2="726" y2="330" stroke="#6b7684" stroke-width="1.5" marker-end="url(#g)"/>
  <line x1="90" y1="330" x2="90" y2="70" stroke="#6b7684" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="726" y="352" text-anchor="end" font-size="12" fill="#6b7684">온도 (℃)</text>
  <text x="34" y="200" transform="rotate(-90 34 200)" text-anchor="middle" font-size="12" fill="#6b7684">증기 압력 (mmHg)</text>
  <line x1="84" y1="110" x2="90" y2="110" stroke="#6b7684" stroke-width="1.5"/>
  <line x1="84" y1="220" x2="90" y2="220" stroke="#6b7684" stroke-width="1.5"/>
  <text x="78" y="114" text-anchor="end" font-size="12" fill="#6b7684">760</text>
  <text x="78" y="224" text-anchor="end" font-size="12" fill="#6b7684">380</text>
  <text x="78" y="334" text-anchor="end" font-size="12" fill="#6b7684">0</text>

  <!-- 증기 압력 곡선 -->
  <path d="M90 329 C240 326, 340 310, 430 268 C500 236, 560 180, 608 94"
        fill="none" stroke="#189fe6" stroke-width="2.5" stroke-linecap="round"/>
  <text x="500" y="80" font-size="13" font-weight="600" fill="#189fe6">물의 증기 압력</text>

  <!-- 외부 압력 두 가지 -->
  <line x1="90" y1="110" x2="700" y2="110" stroke="#0e82c4" stroke-width="2"/>
  <text x="96" y="102" font-size="12" fill="#0e82c4">외부 압력 1 atm (760 mmHg)</text>
  <line x1="90" y1="220" x2="700" y2="220" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="96" y="212" font-size="12" fill="#dc2626">외부 압력 0.5 atm (380 mmHg) — 높은 산 위</text>

  <circle cx="598" cy="110" r="6" fill="#0e82c4"/>
  <rect x="496" y="214" width="12" height="12" fill="#dc2626"/>
  <line x1="598" y1="110" x2="598" y2="330" stroke="#0e82c4" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="502" y1="220" x2="502" y2="330" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="598" y="350" text-anchor="middle" font-size="13" font-weight="600" fill="#0e82c4">100 ℃</text>
  <text x="502" y="350" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">81 ℃</text>
  <text x="612" y="140" font-size="12" fill="#0e82c4">이 점이 기준 끓는점</text>

  <line x1="742" y1="118" x2="742" y2="212" stroke="#6b7684" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="732" y="165" transform="rotate(-90 732 165)" text-anchor="middle" font-size="12" fill="#6b7684">외부 압력을 낮추면</text>
  <line x1="592" y1="372" x2="508" y2="372" stroke="#6b7684" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="550" y="392" text-anchor="middle" font-size="12" fill="#6b7684">끓는점도 낮아진다</text>

  <text x="90" y="392" font-size="12" fill="#d97706">불을 세게 해도 끓는점은 그대로다 — 끓는 빠르기만 달라진다.</text>
</svg>
