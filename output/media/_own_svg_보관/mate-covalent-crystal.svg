<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440"
     font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <title>공유 결정 — 결정 전체가 공유 결합으로 그물처럼 이어져 매우 단단하고 녹는점이 아주 높다. 같은 공유 결합이라도 낱낱의 분자로 끊기면 분자 결정이 되고, 흑연은 층을 따라 움직이는 전자 때문에 전기를 통하는 예외다</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#189fe6"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="24" y="27" font-size="17" font-weight="700" fill="#20242b">공유 결정 — 그물로 이어진 결합, 그리고 흑연이라는 예외</text>

  <!-- 패널 1: 결정 하나가 거대한 그물 -->
  <rect x="24" y="44" width="364" height="220" rx="12" fill="none" stroke="#edf0f4" stroke-width="1.5"/>
  <text x="206" y="66" font-size="15" font-weight="600" fill="#20242b" text-anchor="middle">① 결정 하나가 거대한 그물이다</text>

  <g stroke="#0e82c4" stroke-width="2" stroke-linecap="round">
    <line x1="109" y1="134" x2="76" y2="98"/>
    <line x1="109" y1="134" x2="142" y2="98"/>
    <line x1="109" y1="134" x2="76" y2="170"/>
    <line x1="109" y1="134" x2="142" y2="170"/>
    <line x1="175" y1="134" x2="142" y2="98"/>
    <line x1="175" y1="134" x2="208" y2="98"/>
    <line x1="175" y1="134" x2="142" y2="170"/>
    <line x1="175" y1="134" x2="208" y2="170"/>
    <line x1="241" y1="134" x2="208" y2="98"/>
    <line x1="241" y1="134" x2="274" y2="98"/>
    <line x1="241" y1="134" x2="208" y2="170"/>
    <line x1="241" y1="134" x2="274" y2="170"/>
    <line x1="307" y1="134" x2="274" y2="98"/>
    <line x1="307" y1="134" x2="340" y2="98"/>
    <line x1="307" y1="134" x2="274" y2="170"/>
    <line x1="307" y1="134" x2="340" y2="170"/>
    <line x1="109" y1="206" x2="76" y2="170"/>
    <line x1="109" y1="206" x2="142" y2="170"/>
    <line x1="175" y1="206" x2="142" y2="170"/>
    <line x1="175" y1="206" x2="208" y2="170"/>
    <line x1="241" y1="206" x2="208" y2="170"/>
    <line x1="241" y1="206" x2="274" y2="170"/>
    <line x1="307" y1="206" x2="274" y2="170"/>
    <line x1="307" y1="206" x2="340" y2="170"/>
  </g>
  <g stroke="#0e82c4" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round">
    <line x1="76" y1="98" x2="58" y2="80"/>
    <line x1="340" y1="98" x2="358" y2="80"/>
    <line x1="76" y1="170" x2="58" y2="188"/>
    <line x1="340" y1="170" x2="358" y2="188"/>
    <line x1="109" y1="206" x2="99" y2="216"/><line x1="109" y1="206" x2="119" y2="216"/>
    <line x1="175" y1="206" x2="165" y2="216"/><line x1="175" y1="206" x2="185" y2="216"/>
    <line x1="241" y1="206" x2="231" y2="216"/><line x1="241" y1="206" x2="251" y2="216"/>
    <line x1="307" y1="206" x2="297" y2="216"/><line x1="307" y1="206" x2="317" y2="216"/>
  </g>
  <g fill="#189fe6">
    <circle cx="76" cy="98" r="8"/>
    <circle cx="142" cy="98" r="8"/>
    <circle cx="208" cy="98" r="8"/>
    <circle cx="274" cy="98" r="8"/>
    <circle cx="340" cy="98" r="8"/>
    <circle cx="76" cy="170" r="8"/>
    <circle cx="142" cy="170" r="8"/>
    <circle cx="208" cy="170" r="8"/>
    <circle cx="274" cy="170" r="8"/>
    <circle cx="340" cy="170" r="8"/>
    <circle cx="109" cy="134" r="8"/>
    <circle cx="175" cy="134" r="8"/>
    <circle cx="241" cy="134" r="8"/>
    <circle cx="307" cy="134" r="8"/>
    <circle cx="109" cy="206" r="8"/>
    <circle cx="175" cy="206" r="8"/>
    <circle cx="241" cy="206" r="8"/>
    <circle cx="307" cy="206" r="8"/>
  </g>
  <text x="206" y="232" font-size="13" fill="#6b7684" text-anchor="middle">떼어내려면 공유 결합 자체를 끊어야 한다</text>
  <text x="206" y="252" font-size="13" fill="#6b7684" text-anchor="middle">→ 매우 단단하고 녹는점이 아주 높다</text>

  <!-- 패널 2: 같은 공유 결합, 갈리는 두 갈래 -->
  <rect x="412" y="44" width="364" height="220" rx="12" fill="none" stroke="#edf0f4" stroke-width="1.5"/>
  <text x="594" y="66" font-size="15" font-weight="600" fill="#20242b" text-anchor="middle">② 같은 공유 결합, 갈리는 두 갈래</text>

  <rect x="452" y="84" width="284" height="32" rx="8" fill="#def2ff" stroke="#0e82c4" stroke-width="1.5"/>
  <text x="594" y="100" font-size="15" font-weight="600" fill="#20242b" text-anchor="middle" dominant-baseline="middle">공유 결합으로 이루어진 고체</text>
  <line x1="594" y1="116" x2="594" y2="132" stroke="#0e82c4" stroke-width="1.5"/>
  <rect x="452" y="132" width="284" height="30" rx="8" fill="none" stroke="#0e82c4" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="594" y="147" font-size="13" fill="#20242b" text-anchor="middle" dominant-baseline="middle">결합이 결정 전체로 이어지는가?</text>
  <g stroke="#0e82c4" stroke-width="1.5" stroke-linecap="round">
    <line x1="594" y1="162" x2="594" y2="172"/>
    <line x1="497" y1="172" x2="693" y2="172"/>
    <line x1="497" y1="172" x2="497" y2="192"/>
    <line x1="693" y1="172" x2="693" y2="192"/>
  </g>
  <text x="491" y="190" font-size="12" fill="#6b7684" text-anchor="end">예</text>
  <text x="687" y="190" font-size="12" fill="#6b7684" text-anchor="end">아니오</text>

  <rect x="414" y="192" width="166" height="64" rx="8" fill="#def2ff" stroke="#189fe6" stroke-width="1.5"/>
  <text x="497" y="215" font-size="15" font-weight="600" fill="#20242b" text-anchor="middle">공유 결정</text>
  <text x="497" y="234" font-size="13" fill="#6b7684" text-anchor="middle">결합이 전체로 이어짐</text>
  <text x="497" y="251" font-size="13" fill="#6b7684" text-anchor="middle">예) 다이아몬드 · 석영</text>

  <rect x="610" y="192" width="166" height="64" rx="8" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="693" y="215" font-size="15" font-weight="600" fill="#20242b" text-anchor="middle">분자 결정</text>
  <text x="693" y="234" font-size="13" fill="#6b7684" text-anchor="middle">낱낱의 분자로 끊김</text>
  <text x="693" y="251" font-size="13" fill="#6b7684" text-anchor="middle">예) 드라이아이스</text>

  <!-- 패널 3: 흑연이라는 예외 -->
  <rect x="24" y="280" width="752" height="140" rx="12" fill="none" stroke="#edf0f4" stroke-width="1.5"/>

  <text x="150" y="306" font-size="13" font-weight="600" fill="#20242b" text-anchor="middle">흑연 — 탄소 평면 층</text>
  <text x="60" y="326" font-size="12" fill="#dc2626">전자</text>
  <line x1="60" y1="334" x2="246" y2="334" stroke="#dc2626" stroke-width="1.5" marker-end="url(#r)"/>
  <g fill="#dc2626">
    <circle cx="90" cy="343" r="3.5"/><circle cx="150" cy="343" r="3.5"/><circle cx="210" cy="343" r="3.5"/>
  </g>
  <g stroke="#6b7684" stroke-width="1" stroke-dasharray="4 4">
    <line x1="90" y1="354" x2="90" y2="406"/><line x1="150" y1="354" x2="150" y2="406"/><line x1="210" y1="354" x2="210" y2="406"/>
  </g>
  <g stroke="#0e82c4" stroke-width="2" stroke-linecap="round">
    <line x1="60" y1="354" x2="240" y2="354"/>
    <line x1="60" y1="380" x2="240" y2="380"/>
    <line x1="60" y1="406" x2="240" y2="406"/>
  </g>
  <g fill="#189fe6">
    <circle cx="60" cy="354" r="5"/><circle cx="90" cy="354" r="5"/><circle cx="120" cy="354" r="5"/><circle cx="150" cy="354" r="5"/>
    <circle cx="180" cy="354" r="5"/><circle cx="210" cy="354" r="5"/><circle cx="240" cy="354" r="5"/>
    <circle cx="60" cy="380" r="5"/><circle cx="90" cy="380" r="5"/><circle cx="120" cy="380" r="5"/><circle cx="150" cy="380" r="5"/>
    <circle cx="180" cy="380" r="5"/><circle cx="210" cy="380" r="5"/><circle cx="240" cy="380" r="5"/>
    <circle cx="60" cy="406" r="5"/><circle cx="90" cy="406" r="5"/><circle cx="120" cy="406" r="5"/><circle cx="150" cy="406" r="5"/>
    <circle cx="180" cy="406" r="5"/><circle cx="210" cy="406" r="5"/><circle cx="240" cy="406" r="5"/>
  </g>

  <text x="300" y="304" font-size="15" font-weight="600" fill="#20242b">규칙 — 공유 결정은 대개 전기를 통하지 않는다</text>
  <rect x="300" y="318" width="64" height="24" rx="8" fill="#d97706"/>
  <text x="332" y="330" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">예외</text>
  <text x="376" y="330" font-size="15" font-weight="600" fill="#20242b" dominant-baseline="middle">흑연은 전기를 통한다</text>
  <text x="300" y="364" font-size="13" fill="#6b7684">각 탄소가 내놓은 전자가 층을 따라 자유롭게 움직인다.</text>
  <text x="300" y="386" font-size="13" fill="#6b7684">다이아몬드 · 석영에는 이런 전자가 없어 통하지 않는다.</text>
  <text x="300" y="408" font-size="13" fill="#d97706">흑연은 예외 사례다 — 공유 결정 전체의 성질로 옮기지 마라.</text>
</svg>
