<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430"
     font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <title>결정성 고체 — 입자가 규칙적으로 늘어서 있어 정해진 한 온도에서 녹기 시작하며, 입자를 잇는 화학 결합의 종류에 따라 이온·금속·분자·공유 결정으로 나뉜다</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#189fe6"/>
    </marker>
  </defs>

  <text x="24" y="27" font-size="17" font-weight="700" fill="#20242b">결정성 고체 — 규칙적 배열이 만드는 일정한 녹는점</text>

  <!-- 패널 1: 규칙적 배열 -->
  <rect x="24" y="44" width="364" height="200" rx="12" fill="none" stroke="#edf0f4" stroke-width="1.5"/>
  <text x="206" y="66" font-size="15" font-weight="600" fill="#20242b" text-anchor="middle">① 규칙적 배열</text>

  <g stroke="#7ccfff" stroke-width="1" stroke-dasharray="4 4">
    <line x1="76" y1="88" x2="76" y2="220"/>
    <line x1="128" y1="88" x2="128" y2="220"/>
    <line x1="180" y1="88" x2="180" y2="220"/>
    <line x1="232" y1="88" x2="232" y2="220"/>
    <line x1="284" y1="88" x2="284" y2="220"/>
    <line x1="336" y1="88" x2="336" y2="220"/>
    <line x1="60" y1="100" x2="352" y2="100"/>
    <line x1="60" y1="136" x2="352" y2="136"/>
    <line x1="60" y1="172" x2="352" y2="172"/>
    <line x1="60" y1="208" x2="352" y2="208"/>
  </g>
  <g fill="#189fe6">
    <circle cx="76" cy="100" r="9"/><circle cx="128" cy="100" r="9"/><circle cx="180" cy="100" r="9"/>
    <circle cx="232" cy="100" r="9"/><circle cx="284" cy="100" r="9"/><circle cx="336" cy="100" r="9"/>
    <circle cx="76" cy="136" r="9"/><circle cx="128" cy="136" r="9"/><circle cx="180" cy="136" r="9"/>
    <circle cx="232" cy="136" r="9"/><circle cx="284" cy="136" r="9"/><circle cx="336" cy="136" r="9"/>
    <circle cx="76" cy="172" r="9"/><circle cx="128" cy="172" r="9"/><circle cx="180" cy="172" r="9"/>
    <circle cx="232" cy="172" r="9"/><circle cx="284" cy="172" r="9"/><circle cx="336" cy="172" r="9"/>
    <circle cx="76" cy="208" r="9"/><circle cx="128" cy="208" r="9"/><circle cx="180" cy="208" r="9"/>
    <circle cx="232" cy="208" r="9"/><circle cx="284" cy="208" r="9"/><circle cx="336" cy="208" r="9"/>
  </g>
  <text x="206" y="234" font-size="13" fill="#6b7684" text-anchor="middle">예) 석영 — 규칙이 결정 전체에 이어진다</text>

  <!-- 패널 2: 가열 곡선 -->
  <rect x="412" y="44" width="364" height="200" rx="12" fill="none" stroke="#edf0f4" stroke-width="1.5"/>
  <text x="594" y="66" font-size="15" font-weight="600" fill="#20242b" text-anchor="middle">② 한 온도에서 녹기 시작한다</text>

  <line x1="460" y1="214" x2="460" y2="88" stroke="#0e82c4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="460" y1="214" x2="760" y2="214" stroke="#0e82c4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="460" y="80" font-size="12" fill="#6b7684" text-anchor="middle">온도</text>
  <text x="760" y="232" font-size="12" fill="#6b7684" text-anchor="end">가열 시간</text>

  <line x1="460" y1="150" x2="548" y2="150" stroke="#6b7684" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="454" y="150" font-size="12" fill="#6b7684" text-anchor="end" dominant-baseline="middle">녹는점</text>
  <polyline points="460,206 548,150 658,150 760,96" fill="none" stroke="#189fe6" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
  <text x="654" y="186" font-size="13" fill="#6b7684" text-anchor="middle">다 녹을 때까지 온도가 그대로</text>

  <!-- 패널 3: 결합의 종류에 따른 분류 -->
  <rect x="336" y="262" width="128" height="34" rx="8" fill="#def2ff" stroke="#0e82c4" stroke-width="2"/>
  <text x="400" y="279" font-size="15" font-weight="600" fill="#20242b" text-anchor="middle" dominant-baseline="middle">결정성 고체</text>
  <text x="480" y="279" font-size="13" fill="#6b7684" dominant-baseline="middle">나뉘는 기준 = 입자를 잇는 화학 결합</text>

  <g stroke="#0e82c4" stroke-width="1.5" stroke-linecap="round">
    <line x1="400" y1="296" x2="400" y2="316"/>
    <line x1="118" y1="316" x2="682" y2="316"/>
    <line x1="118" y1="316" x2="118" y2="336"/>
    <line x1="306" y1="316" x2="306" y2="336"/>
    <line x1="494" y1="316" x2="494" y2="336"/>
    <line x1="682" y1="316" x2="682" y2="336"/>
  </g>

  <g fill="none" stroke="#0e82c4" stroke-width="1.5">
    <rect x="34" y="336" width="168" height="56" rx="8"/>
    <rect x="222" y="336" width="168" height="56" rx="8"/>
    <rect x="410" y="336" width="168" height="56" rx="8"/>
    <rect x="598" y="336" width="168" height="56" rx="8"/>
  </g>
  <g font-size="15" font-weight="600" fill="#20242b" text-anchor="middle">
    <text x="118" y="360">이온 결정</text>
    <text x="306" y="360">금속 결정</text>
    <text x="494" y="360">분자 결정</text>
    <text x="682" y="360">공유 결정</text>
  </g>
  <g font-size="13" fill="#6b7684" text-anchor="middle">
    <text x="118" y="380">이온 결합</text>
    <text x="306" y="380">금속 결합</text>
    <text x="494" y="380">분자 간 상호 작용</text>
    <text x="682" y="380">공유 결합</text>
  </g>

  <text x="400" y="414" font-size="13" fill="#6b7684" text-anchor="middle">화학식이 같아도 배열이 규칙적이면 결정성 고체다 — 석영(규칙적) ↔ 유리(불규칙)</text>
</svg>
