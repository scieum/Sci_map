<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="800" height="370"
     font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <title>부분 압력 법칙 — 반응하지 않는 기체를 한 용기에 섞으면 전체 압력은 성분 부분 압력의 합이 된다</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#189fe6"/>
    </marker>
  </defs>

  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#20242b">부분 압력 법칙 — 전체 압력은 부분 압력의 합</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="#6b7684">같은 부피 · 같은 온도 · 서로 반응하지 않는 기체일 때</text>

  <!-- 용기 1: A 만 -->
  <text x="105" y="80" text-anchor="middle" font-size="13" fill="#6b7684">기체 A 만</text>
  <rect x="40" y="88" width="130" height="136" rx="12" fill="#eef1f5" stroke="#6b7684" stroke-width="2"/>
  <circle cx="72" cy="120" r="12" fill="#189fe6"/>
  <circle cx="120" cy="144" r="12" fill="#189fe6"/>
  <circle cx="88" cy="180" r="12" fill="#189fe6"/>
  <circle cx="140" cy="200" r="12" fill="#189fe6"/>
  <text x="105" y="248" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">P<tspan dy="4" font-size="11">A</tspan><tspan dy="-4"> = 2 atm</tspan></text>

  <text x="196" y="164" text-anchor="middle" font-size="24" font-weight="700" fill="#6b7684">+</text>

  <!-- 용기 2: B 만 -->
  <text x="287" y="80" text-anchor="middle" font-size="13" fill="#6b7684">기체 B 만</text>
  <rect x="222" y="88" width="130" height="136" rx="12" fill="#eef1f5" stroke="#6b7684" stroke-width="2"/>
  <path d="M262 118 L275 141 L249 141 Z" fill="#dc2626"/>
  <path d="M312 172 L325 195 L299 195 Z" fill="#dc2626"/>
  <text x="287" y="248" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">P<tspan dy="4" font-size="11">B</tspan><tspan dy="-4"> = 1 atm</tspan></text>

  <line x1="378" y1="156" x2="448" y2="156" stroke="#189fe6" stroke-width="2" marker-end="url(#a)"/>
  <text x="413" y="142" text-anchor="middle" font-size="13" fill="#6b7684">섞는다</text>

  <!-- 용기 3: 혼합 -->
  <text x="539" y="80" text-anchor="middle" font-size="13" fill="#6b7684">A 와 B 를 함께</text>
  <rect x="474" y="88" width="130" height="136" rx="12" fill="#eef1f5" stroke="#6b7684" stroke-width="2"/>
  <circle cx="500" cy="116" r="12" fill="#189fe6"/>
  <circle cx="548" cy="138" r="12" fill="#189fe6"/>
  <circle cx="510" cy="182" r="12" fill="#189fe6"/>
  <circle cx="560" cy="202" r="12" fill="#189fe6"/>
  <path d="M586 108 L599 131 L573 131 Z" fill="#dc2626"/>
  <path d="M496 190 L509 213 L483 213 Z" fill="#dc2626"/>
  <text x="539" y="248" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">P<tspan dy="4" font-size="11">전체</tspan><tspan dy="-4"> = 3 atm</tspan></text>

  <!-- 합 막대 -->
  <text x="684" y="104" text-anchor="middle" font-size="13" fill="#6b7684">전체 3 atm</text>
  <rect x="662" y="119" width="44" height="35" fill="#dc2626"/>
  <rect x="662" y="154" width="44" height="70" fill="#189fe6"/>
  <rect x="662" y="119" width="44" height="105" fill="none" stroke="#20242b" stroke-width="1.5"/>
  <text x="714" y="141" font-size="13" font-weight="600" fill="#20242b">P<tspan dy="4" font-size="10">B</tspan></text>
  <text x="714" y="194" font-size="13" font-weight="600" fill="#20242b">P<tspan dy="4" font-size="10">A</tspan></text>
  <text x="684" y="248" text-anchor="middle" font-size="13" fill="#6b7684">쌓아 올린 값</text>

  <text x="400" y="296" text-anchor="middle" font-size="13" fill="#6b7684">부피가 일정한 용기에 기체를 더 넣으면, 넣은 기체의 부분 압력만큼 전체 압력이 커진다.</text>
  <text x="400" y="318" text-anchor="middle" font-size="13" fill="#6b7684">한 성분의 부분 압력은 곁에 어떤 기체가 함께 있든 그 종류에 좌우되지 않는다.</text>
  <text x="400" y="346" text-anchor="middle" font-size="12" fill="#d97706">평균이 아니다 — 2 atm 과 1 atm 을 합쳐도 1.5 atm 이 되지 않는다.</text>
</svg>
