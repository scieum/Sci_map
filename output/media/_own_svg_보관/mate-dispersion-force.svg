<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450"
     font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <title>분산력 — 순간 쌍극자가 이웃 분자에 쌍극자를 유도해 인력이 생기고, 구조가 닮은 분자끼리는 분자량이 클수록 이 힘이 커진다</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#189fe6"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#20242b">분산력 — 순간 쌍극자가 이웃을 끌어들인다</text>

  <!-- (1) -->
  <rect x="30" y="46" width="220" height="172" rx="12" fill="#eff9ff" stroke="#189fe6" stroke-width="1.5"/>
  <circle cx="95" cy="118" r="30" fill="#def2ff" stroke="#189fe6" stroke-width="2"/>
  <circle cx="185" cy="118" r="30" fill="#def2ff" stroke="#189fe6" stroke-width="2"/>
  <line x1="95" y1="84" x2="95" y2="152" stroke="#6b7684" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="185" y1="84" x2="185" y2="152" stroke="#6b7684" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="140" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">① 둘 다 대칭</text>
  <text x="140" y="198" text-anchor="middle" font-size="12" fill="#6b7684">전자 분포가 고르다</text>

  <line x1="256" y1="118" x2="284" y2="118" stroke="#189fe6" stroke-width="2" marker-end="url(#a)"/>

  <!-- (2) -->
  <rect x="290" y="46" width="220" height="172" rx="12" fill="#eff9ff" stroke="#189fe6" stroke-width="1.5"/>
  <circle cx="352" cy="118" r="30" fill="#def2ff" stroke="#189fe6" stroke-width="2"/>
  <ellipse cx="363" cy="118" rx="16" ry="23" fill="#7ccfff"/>
  <circle cx="352" cy="118" r="30" fill="none" stroke="#189fe6" stroke-width="2"/>
  <text x="336" y="124" text-anchor="middle" font-size="14" font-weight="600" fill="#189fe6">δ<tspan dy="-5" font-size="10">+</tspan></text>
  <text x="370" y="124" text-anchor="middle" font-size="14" font-weight="600" fill="#dc2626">δ<tspan dy="-5" font-size="10">−</tspan></text>
  <circle cx="448" cy="118" r="30" fill="#def2ff" stroke="#189fe6" stroke-width="2"/>
  <line x1="448" y1="84" x2="448" y2="152" stroke="#6b7684" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="400" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">② 왼쪽에 순간 쌍극자</text>
  <text x="400" y="198" text-anchor="middle" font-size="12" fill="#6b7684">오른쪽은 아직 대칭</text>

  <line x1="516" y1="118" x2="544" y2="118" stroke="#189fe6" stroke-width="2" marker-end="url(#a)"/>

  <!-- (3) -->
  <rect x="550" y="46" width="220" height="172" rx="12" fill="#eff9ff" stroke="#189fe6" stroke-width="1.5"/>
  <circle cx="612" cy="118" r="30" fill="#def2ff" stroke="#189fe6" stroke-width="2"/>
  <ellipse cx="623" cy="118" rx="16" ry="23" fill="#7ccfff"/>
  <circle cx="612" cy="118" r="30" fill="none" stroke="#189fe6" stroke-width="2"/>
  <text x="596" y="124" text-anchor="middle" font-size="14" font-weight="600" fill="#189fe6">δ<tspan dy="-5" font-size="10">+</tspan></text>
  <text x="630" y="124" text-anchor="middle" font-size="14" font-weight="600" fill="#dc2626">δ<tspan dy="-5" font-size="10">−</tspan></text>
  <circle cx="708" cy="118" r="30" fill="#def2ff" stroke="#189fe6" stroke-width="2"/>
  <ellipse cx="719" cy="118" rx="16" ry="23" fill="#7ccfff"/>
  <circle cx="708" cy="118" r="30" fill="none" stroke="#189fe6" stroke-width="2"/>
  <text x="692" y="124" text-anchor="middle" font-size="14" font-weight="600" fill="#189fe6">δ<tspan dy="-5" font-size="10">+</tspan></text>
  <text x="726" y="124" text-anchor="middle" font-size="14" font-weight="600" fill="#dc2626">δ<tspan dy="-5" font-size="10">−</tspan></text>
  <line x1="644" y1="118" x2="676" y2="118" stroke="#6b7684" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="660" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#0e82c4">인력</text>
  <text x="660" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">③ 이웃에도 쌍극자 유도</text>
  <text x="660" y="198" text-anchor="middle" font-size="12" fill="#6b7684">두 쌍극자 사이에 인력</text>

  <!-- 조건이 붙은 비교 -->
  <text x="400" y="250" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">구조가 닮은 분자끼리 견줄 때 — 분자량이 클수록 분산력이 크고 끓는점이 높다</text>
  <text x="400" y="272" text-anchor="middle" font-size="12" fill="#d97706">* 구조가 다르면 이 잣대는 통하지 않는다. 물은 분자량이 작아도 끓는점이 높다.</text>

  <line x1="90" y1="396" x2="700" y2="396" stroke="#6b7684" stroke-width="1.5"/>
  <rect x="140" y="380" width="64" height="16" fill="#189fe6"/>
  <text x="172" y="372" text-anchor="middle" font-size="12" fill="#6b7684">-162 ℃</text>
  <rect x="290" y="340" width="64" height="56" fill="#189fe6"/>
  <text x="322" y="332" text-anchor="middle" font-size="12" fill="#6b7684">-89 ℃</text>
  <rect x="440" y="312" width="64" height="84" fill="#189fe6"/>
  <text x="472" y="304" text-anchor="middle" font-size="12" fill="#6b7684">-42 ℃</text>
  <rect x="590" y="286" width="64" height="110" fill="#189fe6"/>
  <text x="622" y="278" text-anchor="middle" font-size="12" fill="#6b7684">-0.5 ℃</text>

  <text x="172" y="416" text-anchor="middle" font-size="13" font-weight="600" fill="#20242b">메테인</text>
  <text x="172" y="434" text-anchor="middle" font-size="12" fill="#6b7684">CH<tspan dy="4" font-size="10">4</tspan><tspan dy="-4"> · 16</tspan></text>
  <text x="322" y="416" text-anchor="middle" font-size="13" font-weight="600" fill="#20242b">에테인</text>
  <text x="322" y="434" text-anchor="middle" font-size="12" fill="#6b7684">C<tspan dy="4" font-size="10">2</tspan><tspan dy="-4">H</tspan><tspan dy="4" font-size="10">6</tspan><tspan dy="-4"> · 30</tspan></text>
  <text x="472" y="416" text-anchor="middle" font-size="13" font-weight="600" fill="#20242b">프로페인</text>
  <text x="472" y="434" text-anchor="middle" font-size="12" fill="#6b7684">C<tspan dy="4" font-size="10">3</tspan><tspan dy="-4">H</tspan><tspan dy="4" font-size="10">8</tspan><tspan dy="-4"> · 44</tspan></text>
  <text x="622" y="416" text-anchor="middle" font-size="13" font-weight="600" fill="#20242b">뷰테인</text>
  <text x="622" y="434" text-anchor="middle" font-size="12" fill="#6b7684">C<tspan dy="4" font-size="10">4</tspan><tspan dy="-4">H</tspan><tspan dy="4" font-size="10">10</tspan><tspan dy="-4"> · 58</tspan></text>

  <text x="776" y="330" text-anchor="end" font-size="12" fill="#6b7684">막대 높이 =</text>
  <text x="776" y="348" text-anchor="end" font-size="12" fill="#6b7684">끓는점 (1 atm)</text>
  <text x="776" y="366" text-anchor="end" font-size="12" fill="#6b7684">아래 숫자 = 분자량</text>
</svg>
