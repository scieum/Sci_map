<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400"
     font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <title>기체 상수 — 기체의 종류나 조건이 달라도 PV/nT 는 같은 값 R 로 모인다</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#189fe6"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#20242b">기체가 무엇이든, 조건이 달라도 PV/nT 는 한 값으로 모인다</text>

  <!-- 기체 카드 -->
  <rect x="40" y="60" width="210" height="130" rx="12" fill="#eff9ff" stroke="#189fe6" stroke-width="2"/>
  <rect x="295" y="60" width="210" height="130" rx="12" fill="#eff9ff" stroke="#0e82c4" stroke-width="2"/>
  <rect x="550" y="60" width="210" height="130" rx="12" fill="#eff9ff" stroke="#7ccfff" stroke-width="2"/>

  <text x="145" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">수소 H<tspan dy="4" font-size="11">2</tspan></text>
  <text x="400" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">산소 O<tspan dy="4" font-size="11">2</tspan></text>
  <text x="655" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">메테인 CH<tspan dy="4" font-size="11">4</tspan></text>

  <g font-size="13" fill="#6b7684" text-anchor="middle">
    <text x="145" y="116">P = 1 atm</text>
    <text x="145" y="136">V = 22.4 L</text>
    <text x="145" y="156">n = 1 mol · T = 273 K</text>
    <text x="400" y="116">P = 2 atm</text>
    <text x="400" y="136">V = 11.2 L</text>
    <text x="400" y="156">n = 1 mol · T = 273 K</text>
    <text x="655" y="116">P = 1 atm</text>
    <text x="655" y="136">V = 44.8 L</text>
    <text x="655" y="156">n = 2 mol · T = 273 K</text>
  </g>
  <g font-size="13" font-weight="700" fill="#20242b" text-anchor="middle">
    <text x="145" y="180">PV/nT = 0.082</text>
    <text x="400" y="180">PV/nT = 0.082</text>
    <text x="655" y="180">PV/nT = 0.082</text>
  </g>

  <!-- 한 값으로 모이는 화살표 -->
  <g stroke="#189fe6" stroke-width="2" stroke-linecap="round" marker-end="url(#a)">
    <line x1="145" y1="196" x2="278" y2="244"/>
    <line x1="400" y1="196" x2="400" y2="244"/>
    <line x1="655" y1="196" x2="522" y2="244"/>
  </g>

  <rect x="230" y="250" width="340" height="72" rx="12" fill="#def2ff" stroke="#0e82c4" stroke-width="2"/>
  <text x="400" y="282" text-anchor="middle" font-size="17" font-weight="700" fill="#20242b">PV / nT = R (기체 상수)</text>
  <text x="400" y="306" text-anchor="middle" font-size="15" font-weight="600" fill="#0e82c4">R ≈ 0.082 atm·L/(mol·K)</text>

  <path d="M120 340 L131 358 L109 358 z" fill="#d97706"/>
  <text x="120" y="354" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">!</text>
  <text x="142" y="354" font-size="13" font-weight="600" fill="#d97706">단위를 바꾸면 수치도 달라진다 — 같은 상수를 SI 단위로 적으면 R = 8.31 J/(mol·K)</text>

  <text x="400" y="384" text-anchor="middle" font-size="13" fill="#6b7684">0.082 라는 수는 0 ℃, 1 atm에서 기체 1 mol의 부피 22.4 L를 식에 넣어 얻은 값이다</text>
</svg>
