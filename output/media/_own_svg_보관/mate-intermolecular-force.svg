<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430"
     font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <title>분자 간 상호 작용 — 세 갈래로 나뉘고, 이 힘이 클수록 액체·고체로 존재하기 쉬우며 녹는점과 끓는점이 높다</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#189fe6"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#20242b">분자 간 상호 작용 — 갈래, 그리고 세기가 낳는 결과</text>

  <!-- 우산 개념 -->
  <rect x="300" y="44" width="200" height="38" rx="8" fill="#def2ff" stroke="#0e82c4" stroke-width="2"/>
  <text x="400" y="63" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="600" fill="#20242b">분자 간 상호 작용</text>

  <path d="M400 82 V102 M140 102 H660 M140 102 V122 M400 102 V122 M660 102 V122"
        fill="none" stroke="#6b7684" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="40" y="122" width="200" height="56" rx="8" fill="#eff9ff" stroke="#189fe6" stroke-width="1.5"/>
  <text x="140" y="145" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">분산력</text>
  <text x="140" y="166" text-anchor="middle" font-size="12" fill="#6b7684">모든 분자 사이</text>

  <rect x="300" y="122" width="200" height="56" rx="8" fill="#eff9ff" stroke="#189fe6" stroke-width="1.5"/>
  <text x="400" y="145" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">쌍극자·쌍극자 힘</text>
  <text x="400" y="166" text-anchor="middle" font-size="12" fill="#6b7684">극성 분자 사이</text>

  <rect x="560" y="122" width="200" height="56" rx="8" fill="#eff9ff" stroke="#189fe6" stroke-width="1.5"/>
  <text x="660" y="145" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">수소 결합</text>
  <text x="660" y="166" text-anchor="middle" font-size="12" fill="#6b7684">N, O, F 에 붙은 H</text>

  <!-- 세기 축 -->
  <line x1="40" y1="204" x2="746" y2="204" stroke="#189fe6" stroke-width="2" marker-end="url(#a)"/>
  <path d="M140 198 V210 M400 198 V210 M660 198 V210" stroke="#6b7684" stroke-width="1"/>
  <text x="40" y="226" font-size="12" fill="#6b7684">세기 약함</text>
  <text x="746" y="226" text-anchor="end" font-size="12" fill="#6b7684">세기 강함</text>
  <text x="400" y="226" text-anchor="middle" font-size="12" fill="#d97706">* 분자량이 비슷한 물질끼리 견줄 때의 대체적인 순서</text>

  <!-- 결과 -->
  <text x="40" y="272" font-size="15" font-weight="600" fill="#20242b">이 힘이 커지면</text>

  <rect x="40" y="286" width="110" height="94" rx="8" fill="#eef1f5" stroke="#6b7684" stroke-width="1.5"/>
  <circle cx="66" cy="310" r="5" fill="#189fe6"/>
  <circle cx="112" cy="334" r="5" fill="#189fe6"/>
  <circle cx="80" cy="364" r="5" fill="#189fe6"/>
  <circle cx="126" cy="300" r="5" fill="#189fe6"/>
  <text x="95" y="400" text-anchor="middle" font-size="13" font-weight="600" fill="#20242b">기체</text>

  <line x1="156" y1="333" x2="182" y2="333" stroke="#189fe6" stroke-width="2" marker-end="url(#a)"/>

  <rect x="188" y="286" width="110" height="94" rx="8" fill="#eef1f5" stroke="#6b7684" stroke-width="1.5"/>
  <circle cx="212" cy="342" r="5" fill="#189fe6"/>
  <circle cx="230" cy="352" r="5" fill="#189fe6"/>
  <circle cx="248" cy="342" r="5" fill="#189fe6"/>
  <circle cx="266" cy="352" r="5" fill="#189fe6"/>
  <circle cx="222" cy="364" r="5" fill="#189fe6"/>
  <circle cx="244" cy="366" r="5" fill="#189fe6"/>
  <circle cx="268" cy="366" r="5" fill="#189fe6"/>
  <text x="243" y="400" text-anchor="middle" font-size="13" font-weight="600" fill="#20242b">액체</text>

  <line x1="304" y1="333" x2="330" y2="333" stroke="#189fe6" stroke-width="2" marker-end="url(#a)"/>

  <rect x="336" y="286" width="110" height="94" rx="8" fill="#eef1f5" stroke="#6b7684" stroke-width="1.5"/>
  <circle cx="362" cy="310" r="5" fill="#189fe6"/>
  <circle cx="391" cy="310" r="5" fill="#189fe6"/>
  <circle cx="420" cy="310" r="5" fill="#189fe6"/>
  <circle cx="362" cy="334" r="5" fill="#189fe6"/>
  <circle cx="391" cy="334" r="5" fill="#189fe6"/>
  <circle cx="420" cy="334" r="5" fill="#189fe6"/>
  <circle cx="362" cy="358" r="5" fill="#189fe6"/>
  <circle cx="391" cy="358" r="5" fill="#189fe6"/>
  <circle cx="420" cy="358" r="5" fill="#189fe6"/>
  <text x="391" y="400" text-anchor="middle" font-size="13" font-weight="600" fill="#20242b">고체</text>

  <line x1="456" y1="333" x2="486" y2="333" stroke="#189fe6" stroke-width="2" marker-end="url(#a)"/>

  <rect x="494" y="286" width="266" height="94" rx="12" fill="#eff9ff" stroke="#189fe6" stroke-width="1.5"/>
  <text x="627" y="314" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">녹는점 · 끓는점이 높아진다</text>
  <text x="627" y="340" text-anchor="middle" font-size="12" fill="#6b7684">같은 물질에서 인력이 미치는 영향은</text>
  <text x="627" y="360" text-anchor="middle" font-size="12" fill="#6b7684">고체 · 액체 · 기체 순으로 작아진다</text>

  <text x="400" y="422" text-anchor="middle" font-size="12" fill="#d97706">분자 안의 원자를 잇는 공유 결합과는 다른, 분자와 분자 사이의 훨씬 약한 힘이다.</text>
</svg>
