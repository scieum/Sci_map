<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450"
     font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <title>이온 결정 — 한 이온이 반대 전하 이온 여럿과 맞물려 단단하고 녹는점이 높으며, 층이 밀리면 같은 전하가 마주쳐 쪼개지고, 고체에서는 전기가 통하지 않지만 녹거나 물에 녹으면 통한다</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#189fe6"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="24" y="27" font-size="17" font-weight="700" fill="#20242b">이온 결정 — 맞물림 · 쪼개짐 · 전기 전도</text>

  <!-- 패널 1: 사방에서 맞물린다 -->
  <rect x="24" y="44" width="364" height="210" rx="12" fill="none" stroke="#edf0f4" stroke-width="1.5"/>
  <text x="206" y="66" font-size="15" font-weight="600" fill="#20242b" text-anchor="middle">① 염화 소듐 — 사방에서 맞물린다</text>

  <g stroke="#0e82c4" stroke-width="2" stroke-linecap="round">
    <line x1="206" y1="148" x2="154" y2="148"/>
    <line x1="206" y1="148" x2="258" y2="148"/>
    <line x1="206" y1="148" x2="206" y2="104"/>
    <line x1="206" y1="148" x2="206" y2="192"/>
  </g>
  <g>
    <circle cx="102" cy="104" r="11" fill="#189fe6"/><circle cx="154" cy="104" r="15" fill="#dc2626"/>
    <circle cx="206" cy="104" r="11" fill="#189fe6"/><circle cx="258" cy="104" r="15" fill="#dc2626"/>
    <circle cx="310" cy="104" r="11" fill="#189fe6"/>
    <circle cx="102" cy="148" r="15" fill="#dc2626"/><circle cx="154" cy="148" r="11" fill="#189fe6"/>
    <circle cx="206" cy="148" r="15" fill="#dc2626" stroke="#20242b" stroke-width="2"/>
    <circle cx="258" cy="148" r="11" fill="#189fe6"/><circle cx="310" cy="148" r="15" fill="#dc2626"/>
    <circle cx="102" cy="192" r="11" fill="#189fe6"/><circle cx="154" cy="192" r="15" fill="#dc2626"/>
    <circle cx="206" cy="192" r="11" fill="#189fe6"/><circle cx="258" cy="192" r="15" fill="#dc2626"/>
    <circle cx="310" cy="192" r="11" fill="#189fe6"/>
  </g>
  <circle cx="78" cy="222" r="8" fill="#189fe6"/>
  <text x="92" y="222" font-size="13" fill="#20242b" dominant-baseline="middle">Na<tspan dy="-5" font-size="10">+</tspan><tspan dy="5"> 양이온</tspan></text>
  <circle cx="216" cy="222" r="11" fill="#dc2626"/>
  <text x="232" y="222" font-size="13" fill="#20242b" dominant-baseline="middle">Cl<tspan dy="-5" font-size="10">−</tspan><tspan dy="5"> 음이온</tspan></text>
  <text x="206" y="246" font-size="13" fill="#6b7684" text-anchor="middle">인력이 사방으로 걸린다 → 단단하고 녹는점이 높다</text>

  <!-- 패널 2: 층이 밀리면 쪼개진다 -->
  <rect x="412" y="44" width="364" height="210" rx="12" fill="none" stroke="#edf0f4" stroke-width="1.5"/>
  <text x="594" y="66" font-size="15" font-weight="600" fill="#20242b" text-anchor="middle">② 층이 밀리면 쪼개진다</text>

  <text x="496" y="88" font-size="12" fill="#6b7684" text-anchor="middle">밀기 전</text>
  <g fill="#f3f5f8">
    <rect x="437" y="97" width="118" height="30" rx="15"/>
    <rect x="437" y="141" width="118" height="30" rx="15"/>
  </g>
  <g>
    <circle cx="452" cy="112" r="10" fill="#189fe6"/><circle cx="496" cy="112" r="13" fill="#dc2626"/><circle cx="540" cy="112" r="10" fill="#189fe6"/>
    <circle cx="452" cy="156" r="13" fill="#dc2626"/><circle cx="496" cy="156" r="10" fill="#189fe6"/><circle cx="540" cy="156" r="13" fill="#dc2626"/>
  </g>

  <line x1="566" y1="134" x2="602" y2="134" stroke="#189fe6" stroke-width="2" marker-end="url(#a)"/>
  <text x="584" y="120" font-size="12" fill="#6b7684" text-anchor="middle">힘</text>

  <text x="690" y="88" font-size="12" fill="#6b7684" text-anchor="middle">민 뒤</text>
  <g fill="#f3f5f8">
    <rect x="653" y="91" width="118" height="30" rx="15"/>
    <rect x="609" y="147" width="118" height="30" rx="15"/>
  </g>
  <g>
    <circle cx="668" cy="106" r="10" fill="#189fe6"/><circle cx="712" cy="106" r="13" fill="#dc2626"/><circle cx="756" cy="106" r="10" fill="#189fe6"/>
    <circle cx="624" cy="162" r="13" fill="#dc2626"/><circle cx="668" cy="162" r="10" fill="#189fe6"/><circle cx="712" cy="162" r="13" fill="#dc2626"/>
  </g>
  <g stroke="#dc2626" stroke-width="1.5">
    <line x1="668" y1="134" x2="668" y2="124" marker-end="url(#r)"/>
    <line x1="668" y1="134" x2="668" y2="144" marker-end="url(#r)"/>
    <line x1="712" y1="134" x2="712" y2="124" marker-end="url(#r)"/>
    <line x1="712" y1="134" x2="712" y2="144" marker-end="url(#r)"/>
  </g>
  <text x="772" y="190" font-size="12" fill="#dc2626" text-anchor="end">같은 전하끼리 마주쳐 밀어낸다</text>
  <text x="594" y="214" font-size="13" fill="#6b7684" text-anchor="middle">층이 한 칸 밀리면 배열이 어긋나고</text>
  <text x="594" y="234" font-size="13" fill="#6b7684" text-anchor="middle">반발이 생겨 결정이 쪼개진다</text>

  <!-- 패널 3: 이온이 움직일 수 있을 때만 통한다 -->
  <rect x="24" y="270" width="752" height="164" rx="12" fill="none" stroke="#edf0f4" stroke-width="1.5"/>
  <text x="44" y="292" font-size="15" font-weight="600" fill="#20242b">③ 이온이 움직일 수 있을 때만 전기가 통한다</text>

  <!-- 고체 -->
  <g stroke="#6b7684" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M130 344 L130 324 L146 324"/><path d="M186 344 L186 324 L170 324"/>
  </g>
  <line x1="130" y1="344" x2="130" y2="380" stroke="#6b7684" stroke-width="3" stroke-linecap="round"/>
  <line x1="186" y1="344" x2="186" y2="380" stroke="#6b7684" stroke-width="3" stroke-linecap="round"/>
  <circle cx="158" cy="324" r="11" fill="#eef1f5" stroke="#6b7684" stroke-width="1.5"/>
  <text x="182" y="310" font-size="12" fill="#6b7684">꺼짐</text>
  <rect x="100" y="338" width="116" height="52" rx="8" fill="#ffffff" stroke="#6b7684" stroke-width="1.5"/>
  <g>
    <circle cx="140" cy="356" r="5" fill="#189fe6"/><circle cx="158" cy="356" r="7" fill="#dc2626"/><circle cx="176" cy="356" r="5" fill="#189fe6"/>
    <circle cx="140" cy="374" r="7" fill="#dc2626"/><circle cx="158" cy="374" r="5" fill="#189fe6"/><circle cx="176" cy="374" r="7" fill="#dc2626"/>
  </g>
  <text x="158" y="408" font-size="13" fill="#6b7684" text-anchor="middle">고체 — 이온이 제자리</text>
  <text x="158" y="424" font-size="13" fill="#6b7684" text-anchor="middle">전기가 통하지 않는다</text>

  <!-- 녹은 상태 -->
  <g stroke="#6b7684" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M372 344 L372 324 L388 324"/><path d="M428 344 L428 324 L412 324"/>
  </g>
  <line x1="372" y1="344" x2="372" y2="380" stroke="#6b7684" stroke-width="3" stroke-linecap="round"/>
  <line x1="428" y1="344" x2="428" y2="380" stroke="#6b7684" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#189fe6" stroke-width="2" stroke-linecap="round">
    <line x1="400" y1="306" x2="400" y2="300"/><line x1="386" y1="311" x2="382" y2="306"/>
    <line x1="414" y1="311" x2="418" y2="306"/>
  </g>
  <circle cx="400" cy="324" r="11" fill="#189fe6" stroke="#0e82c4" stroke-width="1.5"/>
  <text x="424" y="310" font-size="12" fill="#20242b">켜짐</text>
  <rect x="342" y="338" width="116" height="52" rx="8" fill="#ffffff" stroke="#6b7684" stroke-width="1.5"/>
  <g>
    <circle cx="384" cy="352" r="5" fill="#189fe6"/><circle cx="408" cy="358" r="7" fill="#dc2626"/>
    <circle cx="352" cy="372" r="7" fill="#dc2626"/><circle cx="378" cy="378" r="5" fill="#189fe6"/>
    <circle cx="404" cy="374" r="5" fill="#189fe6"/><circle cx="440" cy="356" r="7" fill="#dc2626"/>
  </g>
  <g stroke="#189fe6" stroke-width="1.5">
    <line x1="392" y1="344" x2="404" y2="344" marker-end="url(#a)"/>
    <line x1="418" y1="380" x2="406" y2="380" marker-end="url(#a)"/>
  </g>
  <text x="400" y="408" font-size="13" fill="#6b7684" text-anchor="middle">녹은 상태 — 이온이 이동</text>
  <text x="400" y="424" font-size="13" fill="#6b7684" text-anchor="middle">전기가 통한다</text>

  <!-- 수용액 -->
  <g stroke="#6b7684" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M614 344 L614 324 L630 324"/><path d="M670 344 L670 324 L654 324"/>
  </g>
  <line x1="614" y1="344" x2="614" y2="380" stroke="#6b7684" stroke-width="3" stroke-linecap="round"/>
  <line x1="670" y1="344" x2="670" y2="380" stroke="#6b7684" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#189fe6" stroke-width="2" stroke-linecap="round">
    <line x1="642" y1="306" x2="642" y2="300"/><line x1="628" y1="311" x2="624" y2="306"/>
    <line x1="656" y1="311" x2="660" y2="306"/>
  </g>
  <circle cx="642" cy="324" r="11" fill="#189fe6" stroke="#0e82c4" stroke-width="1.5"/>
  <text x="666" y="310" font-size="12" fill="#20242b">켜짐</text>
  <rect x="584" y="338" width="116" height="52" rx="8" fill="#def2ff" stroke="#6b7684" stroke-width="1.5"/>
  <g>
    <circle cx="626" cy="352" r="5" fill="#189fe6"/><circle cx="650" cy="358" r="7" fill="#dc2626"/>
    <circle cx="594" cy="372" r="7" fill="#dc2626"/><circle cx="620" cy="378" r="5" fill="#189fe6"/>
    <circle cx="646" cy="374" r="5" fill="#189fe6"/><circle cx="682" cy="356" r="7" fill="#dc2626"/>
  </g>
  <g stroke="#189fe6" stroke-width="1.5">
    <line x1="634" y1="344" x2="646" y2="344" marker-end="url(#a)"/>
    <line x1="660" y1="380" x2="648" y2="380" marker-end="url(#a)"/>
  </g>
  <text x="642" y="408" font-size="13" fill="#6b7684" text-anchor="middle">수용액 — 이온이 물속에서 이동</text>
  <text x="642" y="424" font-size="13" fill="#6b7684" text-anchor="middle">전기가 통한다</text>

</svg>
