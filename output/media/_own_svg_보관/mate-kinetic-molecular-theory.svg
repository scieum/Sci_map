<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420"
     font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <title>기체 분자 운동론 — 세 가지 가정과, 절대 온도에 비례하는 평균 운동 에너지</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#189fe6"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#20242b">기체 분자 운동론은 세 가지 가정에서 출발한다</text>

  <text x="144" y="50" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">① 분자의 부피 = 0</text>
  <text x="400" y="50" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">② 분자 사이 힘 = 0</text>
  <text x="656" y="50" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">③ 충돌에서 잃는 에너지 = 0</text>

  <rect x="24" y="58" width="240" height="132" rx="12" fill="#eff9ff" stroke="#0e82c4" stroke-width="1.5"/>
  <rect x="280" y="58" width="240" height="132" rx="12" fill="#eff9ff" stroke="#0e82c4" stroke-width="1.5"/>
  <rect x="536" y="58" width="240" height="132" rx="12" fill="#eff9ff" stroke="#0e82c4" stroke-width="1.5"/>

  <!-- ① 분자의 부피 -->
  <g fill="#189fe6">
    <circle cx="60" cy="100" r="2.5"/><circle cx="110" cy="140" r="2.5"/><circle cx="160" cy="95" r="2.5"/>
    <circle cx="210" cy="150" r="2.5"/><circle cx="85" cy="165" r="2.5"/><circle cx="235" cy="110" r="2.5"/>
  </g>
  <text x="144" y="180" text-anchor="middle" font-size="12" fill="#6b7684">거의 모두가 빈 공간이다</text>

  <!-- ② 분자 사이 힘 -->
  <circle cx="350" cy="110" r="9" fill="#189fe6"/>
  <circle cx="450" cy="110" r="9" fill="#189fe6"/>
  <line x1="359" y1="110" x2="441" y2="110" stroke="#6b7684" stroke-width="1.5" stroke-dasharray="4 4"/>
  <g stroke="#dc2626" stroke-width="2.5" stroke-linecap="round">
    <line x1="392" y1="102" x2="408" y2="118"/>
    <line x1="408" y1="102" x2="392" y2="118"/>
  </g>
  <line x1="341" y1="101" x2="317" y2="85" stroke="#189fe6" stroke-width="2" stroke-linecap="round" marker-end="url(#a)"/>
  <line x1="459" y1="101" x2="483" y2="85" stroke="#189fe6" stroke-width="2" stroke-linecap="round" marker-end="url(#a)"/>
  <text x="400" y="180" text-anchor="middle" font-size="12" fill="#6b7684">끌지도 밀지도 않고 지나간다</text>

  <!-- ③ 탄성 충돌 -->
  <line x1="548" y1="160" x2="764" y2="160" stroke="#6b7684" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M552 160 Q574 88 596 160 Q618 88 640 160" fill="none" stroke="#189fe6" stroke-width="2" stroke-linecap="round"/>
  <path d="M650 160 Q668 96 686 160 Q700 128 714 160 Q724 144 734 160" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>
  <text x="596" y="180" text-anchor="middle" font-size="12" fill="#189fe6">기체 분자 (가정)</text>
  <text x="694" y="180" text-anchor="middle" font-size="12" fill="#dc2626">보통의 공</text>

  <g font-size="13" fill="#6b7684" text-anchor="middle">
    <text x="144" y="210">분자가 차지하는 자리를 무시한다</text>
    <text x="144" y="228">용기의 부피가 곧 움직일 부피다</text>
    <text x="400" y="210">인력도 반발력도 없다고 놓는다</text>
    <text x="400" y="228">그래서 저절로 뭉치지 않는다</text>
    <text x="656" y="210">충돌해도 에너지가 사라지지 않는다</text>
    <text x="656" y="228">분자 운동은 저절로 멎지 않는다</text>
  </g>

  <line x1="24" y1="252" x2="776" y2="252" stroke="#edf0f4" stroke-width="2"/>

  <text x="400" y="278" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">같은 절대 온도에서는 종류가 달라도 평균 운동 에너지가 같다</text>

  <rect x="90" y="294" width="300" height="80" rx="12" fill="#eff9ff" stroke="#0e82c4" stroke-width="1.5"/>
  <rect x="410" y="294" width="300" height="80" rx="12" fill="#eff9ff" stroke="#0e82c4" stroke-width="1.5"/>

  <text x="240" y="318" text-anchor="middle" font-size="15" font-weight="600" fill="#189fe6">가벼운 분자</text>
  <circle cx="140" cy="350" r="7" fill="#189fe6"/>
  <line x1="149" y1="350" x2="229" y2="350" stroke="#189fe6" stroke-width="2" stroke-linecap="round" marker-end="url(#a)"/>
  <text x="248" y="354" font-size="12" fill="#6b7684">속력 빠름</text>

  <text x="560" y="318" text-anchor="middle" font-size="15" font-weight="600" fill="#dc2626">무거운 분자</text>
  <circle cx="460" cy="350" r="13" fill="#dc2626" fill-opacity="0.25" stroke="#dc2626" stroke-width="2"/>
  <line x1="475" y1="350" x2="515" y2="350" stroke="#dc2626" stroke-width="2" stroke-linecap="round" marker-end="url(#ar)"/>
  <text x="536" y="354" font-size="12" fill="#6b7684">속력 느림</text>

  <text x="400" y="398" text-anchor="middle" font-size="13" fill="#6b7684">평균 운동 에너지는 두 경우가 같다 — 절대 온도가 오르면 함께 커진다</text>
</svg>
