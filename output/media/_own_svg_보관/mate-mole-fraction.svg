<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360"
     font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <title>몰분율 — 성분의 몰분율을 모두 더하면 1이 되고, 몰분율이 큰 성분일수록 부분 압력도 크다</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#189fe6"/>
    </marker>
  </defs>

  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#20242b">몰분율 — 모두 더하면 1, 부분 압력은 그 비율대로</text>

  <!-- 혼합 기체 용기 -->
  <rect x="44" y="76" width="150" height="160" rx="12" fill="#eef1f5" stroke="#6b7684" stroke-width="2"/>
  <circle cx="82" cy="112" r="14" fill="#189fe6"/>
  <text x="82" y="112" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#ffffff">A</text>
  <circle cx="135" cy="140" r="14" fill="#189fe6"/>
  <text x="135" y="140" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#ffffff">A</text>
  <circle cx="92" cy="190" r="14" fill="#189fe6"/>
  <text x="92" y="190" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#ffffff">A</text>
  <rect x="143" y="185" width="28" height="28" rx="4" fill="#dc2626"/>
  <text x="157" y="199" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#ffffff">B</text>
  <text x="119" y="258" text-anchor="middle" font-size="13" fill="#6b7684">A 3 mol · B 1 mol</text>
  <text x="119" y="277" text-anchor="middle" font-size="13" fill="#6b7684">전체 4 mol</text>

  <!-- 몰분율 막대 -->
  <text x="250" y="92" font-size="15" font-weight="600" fill="#20242b">몰분율</text>
  <rect x="250" y="104" width="330" height="46" fill="#189fe6"/>
  <rect x="580" y="104" width="110" height="46" fill="#dc2626"/>
  <rect x="250" y="104" width="440" height="46" fill="none" stroke="#20242b" stroke-width="1.5"/>
  <text x="415" y="127" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="600" fill="#ffffff">X<tspan dy="4" font-size="11">A</tspan><tspan dy="-4"> = 0.75</tspan></text>
  <text x="635" y="127" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="600" fill="#ffffff">X<tspan dy="4" font-size="11">B</tspan><tspan dy="-4"> = 0.25</tspan></text>
  <text x="700" y="120" font-size="15" font-weight="600" fill="#20242b">합 = 1</text>
  <text x="700" y="145" font-size="12" fill="#6b7684">합 = 100</text>
  <line x1="698" y1="141" x2="754" y2="141" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <text x="700" y="163" font-size="12" fill="#dc2626">백분율 아님</text>

  <!-- 비례 -->
  <line x1="300" y1="158" x2="300" y2="226" stroke="#189fe6" stroke-width="2" marker-end="url(#a)"/>
  <text x="316" y="188" font-size="13" fill="#6b7684">전체 압력 4 atm 을 이 비율대로 나눈다</text>
  <line x1="580" y1="104" x2="580" y2="278" stroke="#6b7684" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 부분 압력 막대 -->
  <text x="250" y="220" font-size="15" font-weight="600" fill="#20242b">부분 압력</text>
  <rect x="250" y="232" width="330" height="46" fill="#189fe6"/>
  <rect x="580" y="232" width="110" height="46" fill="#dc2626"/>
  <rect x="250" y="232" width="440" height="46" fill="none" stroke="#20242b" stroke-width="1.5"/>
  <text x="415" y="255" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="600" fill="#ffffff">P<tspan dy="4" font-size="11">A</tspan><tspan dy="-4"> = 3 atm</tspan></text>
  <text x="635" y="255" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="600" fill="#ffffff">P<tspan dy="4" font-size="11">B</tspan><tspan dy="-4"> = 1 atm</tspan></text>
  <text x="700" y="250" font-size="15" font-weight="600" fill="#20242b">합 = 4 atm</text>
  <text x="700" y="270" font-size="12" fill="#6b7684">전체 압력</text>

  <text x="400" y="322" text-anchor="middle" font-size="13" fill="#6b7684">몰분율이 큰 성분일수록 부분 압력도 크다 — 두 막대가 같은 자리에서 갈린다.</text>
  <text x="400" y="344" text-anchor="middle" font-size="13" fill="#6b7684">몰분율은 양(mol)끼리 나눈 값이라 단위가 없고 0과 1 사이에 놓인다.</text>
</svg>
