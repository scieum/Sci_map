<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440"
     font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <title>분자 결정 — 분자를 붙잡는 힘이 약한 분자 간 상호 작용이어서 녹는점이 낮고, 일부는 녹지 않고 바로 승화하며, 전하를 나를 입자가 없어 고체에서도 녹은 뒤에도 전기를 통하지 않는다</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#189fe6"/>
    </marker>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#d97706"/>
    </marker>
  </defs>

  <text x="24" y="27" font-size="17" font-weight="700" fill="#20242b">분자 결정 — 약한 힘으로 쌓이고, 낮은 온도에서 풀린다</text>

  <!-- 패널 1: 끊어지는 것은 분자 사이의 힘 -->
  <rect x="24" y="44" width="364" height="220" rx="12" fill="none" stroke="#edf0f4" stroke-width="1.5"/>
  <text x="206" y="66" font-size="15" font-weight="600" fill="#20242b" text-anchor="middle">① 끊어지는 것은 분자 사이의 힘</text>

  <text x="206" y="92" font-size="12" fill="#dc2626" text-anchor="middle">녹을 때 끊어지는 곳</text>
  <line x1="166" y1="98" x2="153" y2="116" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 4"/>

  <g stroke="#dc2626" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round">
    <line x1="126" y1="124" x2="180" y2="124"/><line x1="232" y1="124" x2="286" y2="124"/>
    <line x1="126" y1="182" x2="180" y2="182"/><line x1="232" y1="182" x2="286" y2="182"/>
    <line x1="100" y1="137" x2="100" y2="169"/><line x1="206" y1="137" x2="206" y2="169"/><line x1="312" y1="137" x2="312" y2="169"/>
  </g>
  <g stroke="#0e82c4" stroke-width="4" stroke-linecap="round">
    <line x1="85" y1="124" x2="115" y2="124"/><line x1="191" y1="124" x2="221" y2="124"/><line x1="297" y1="124" x2="327" y2="124"/>
    <line x1="85" y1="182" x2="115" y2="182"/><line x1="191" y1="182" x2="221" y2="182"/><line x1="297" y1="182" x2="327" y2="182"/>
  </g>
  <g fill="#189fe6">
    <circle cx="85" cy="124" r="11"/><circle cx="115" cy="124" r="11"/>
    <circle cx="191" cy="124" r="11"/><circle cx="221" cy="124" r="11"/>
    <circle cx="297" cy="124" r="11"/><circle cx="327" cy="124" r="11"/>
    <circle cx="85" cy="182" r="11"/><circle cx="115" cy="182" r="11"/>
    <circle cx="191" cy="182" r="11"/><circle cx="221" cy="182" r="11"/>
    <circle cx="297" cy="182" r="11"/><circle cx="327" cy="182" r="11"/>
  </g>

  <line x1="44" y1="224" x2="72" y2="224" stroke="#0e82c4" stroke-width="4" stroke-linecap="round"/>
  <text x="80" y="228" font-size="13" fill="#6b7684">공유 결합 — 강하다 (분자 안)</text>
  <line x1="44" y1="246" x2="72" y2="246" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>
  <text x="80" y="250" font-size="13" fill="#6b7684">분자 간 상호 작용 — 약하다</text>

  <!-- 패널 2: 낮은 온도에서 풀린다 -->
  <rect x="412" y="44" width="364" height="220" rx="12" fill="none" stroke="#edf0f4" stroke-width="1.5"/>
  <text x="594" y="66" font-size="15" font-weight="600" fill="#20242b" text-anchor="middle">② 낮은 온도에서 풀린다</text>

  <text x="594" y="112" font-size="13" fill="#d97706" text-anchor="middle">승화 — 일부만 (드라이아이스 · 아이오딘)</text>
  <path d="M470 166 C 500 118, 688 118, 718 166" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#w)"/>

  <g fill="none" stroke="#6b7684" stroke-width="1.5">
    <rect x="420" y="170" width="100" height="44" rx="8"/>
    <rect x="544" y="170" width="100" height="44" rx="8"/>
    <rect x="668" y="170" width="100" height="44" rx="8"/>
  </g>
  <g font-size="15" font-weight="600" fill="#20242b" text-anchor="middle" dominant-baseline="middle">
    <text x="470" y="192">고체</text>
    <text x="594" y="192">액체</text>
    <text x="718" y="192">기체</text>
  </g>
  <g stroke="#189fe6" stroke-width="2" stroke-linecap="round">
    <line x1="524" y1="192" x2="540" y2="192" marker-end="url(#a)"/>
    <line x1="648" y1="192" x2="664" y2="192" marker-end="url(#a)"/>
  </g>
  <text x="594" y="238" font-size="13" fill="#6b7684" text-anchor="middle">분자를 붙잡는 힘이 약해 낮은 온도에서 풀린다</text>
  <text x="594" y="256" font-size="13" fill="#6b7684" text-anchor="middle">→ 네 결정 가운데 녹는점이 가장 낮다</text>

  <!-- 패널 3: 어느 쪽에서도 전기가 통하지 않는다 -->
  <rect x="24" y="280" width="752" height="140" rx="12" fill="none" stroke="#edf0f4" stroke-width="1.5"/>
  <text x="44" y="300" font-size="15" font-weight="600" fill="#20242b">③ 고체에서도, 녹인 뒤에도 전기를 통하지 않는다</text>

  <!-- 고체 -->
  <g stroke="#6b7684" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M124 346 L124 328 L140 328"/><path d="M176 346 L176 328 L160 328"/>
  </g>
  <line x1="124" y1="346" x2="124" y2="382" stroke="#6b7684" stroke-width="3" stroke-linecap="round"/>
  <line x1="176" y1="346" x2="176" y2="382" stroke="#6b7684" stroke-width="3" stroke-linecap="round"/>
  <circle cx="150" cy="328" r="11" fill="#eef1f5" stroke="#6b7684" stroke-width="1.5"/>
  <text x="176" y="318" font-size="12" fill="#6b7684">꺼짐</text>
  <rect x="94" y="340" width="112" height="48" rx="8" fill="#ffffff" stroke="#6b7684" stroke-width="1.5"/>
  <g stroke="#0e82c4" stroke-width="2" stroke-linecap="round">
    <line x1="130" y1="356" x2="142" y2="356"/><line x1="158" y1="356" x2="170" y2="356"/>
    <line x1="130" y1="374" x2="142" y2="374"/><line x1="158" y1="374" x2="170" y2="374"/>
  </g>
  <g fill="#189fe6">
    <circle cx="130" cy="356" r="4"/><circle cx="142" cy="356" r="4"/><circle cx="158" cy="356" r="4"/><circle cx="170" cy="356" r="4"/>
    <circle cx="130" cy="374" r="4"/><circle cx="142" cy="374" r="4"/><circle cx="158" cy="374" r="4"/><circle cx="170" cy="374" r="4"/>
  </g>
  <text x="150" y="406" font-size="13" fill="#6b7684" text-anchor="middle">고체 상태</text>

  <!-- 녹인 액체 -->
  <g stroke="#6b7684" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M304 346 L304 328 L320 328"/><path d="M356 346 L356 328 L340 328"/>
  </g>
  <line x1="304" y1="346" x2="304" y2="382" stroke="#6b7684" stroke-width="3" stroke-linecap="round"/>
  <line x1="356" y1="346" x2="356" y2="382" stroke="#6b7684" stroke-width="3" stroke-linecap="round"/>
  <circle cx="330" cy="328" r="11" fill="#eef1f5" stroke="#6b7684" stroke-width="1.5"/>
  <text x="356" y="318" font-size="12" fill="#6b7684">꺼짐</text>
  <rect x="274" y="340" width="112" height="48" rx="8" fill="#ffffff" stroke="#6b7684" stroke-width="1.5"/>
  <g stroke="#0e82c4" stroke-width="2" stroke-linecap="round">
    <line x1="312" y1="352" x2="324" y2="358"/><line x1="342" y1="350" x2="352" y2="358"/>
    <line x1="286" y1="374" x2="298" y2="370"/><line x1="336" y1="376" x2="348" y2="372"/>
  </g>
  <g fill="#189fe6">
    <circle cx="312" cy="352" r="4"/><circle cx="324" cy="358" r="4"/><circle cx="342" cy="350" r="4"/><circle cx="352" cy="358" r="4"/>
    <circle cx="286" cy="374" r="4"/><circle cx="298" cy="370" r="4"/><circle cx="336" cy="376" r="4"/><circle cx="348" cy="372" r="4"/>
  </g>
  <text x="330" y="406" font-size="13" fill="#6b7684" text-anchor="middle">녹인 액체</text>

  <text x="470" y="340" font-size="15" font-weight="600" fill="#20242b">전하를 나를 입자가 없다</text>
  <text x="470" y="364" font-size="13" fill="#6b7684">이온도 없고 자유 전자도 없다.</text>
  <text x="470" y="386" font-size="13" fill="#6b7684">녹여도 나타나는 것은 중성 분자뿐이다.</text>
  <text x="470" y="408" font-size="13" fill="#6b7684">→ 어느 쪽에서도 전구가 켜지지 않는다.</text>
</svg>
