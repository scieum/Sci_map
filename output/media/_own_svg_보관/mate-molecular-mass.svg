<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400"
     font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <title>분자량 — 단위 없는 상대값이며 몰 질량과 구분된다. 질량이 같으면 분자량이 큰 쪽이 양(mol)이 적다</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#189fe6"/>
    </marker>
    <g id="o2">
      <circle cx="-9" cy="0" r="9"/><circle cx="9" cy="0" r="9"/>
    </g>
    <g id="ch4">
      <circle cx="0" cy="0" r="7"/>
      <circle cx="-11" cy="-7" r="3.5"/><circle cx="11" cy="-7" r="3.5"/>
      <circle cx="-11" cy="7" r="3.5"/><circle cx="11" cy="7" r="3.5"/>
    </g>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#20242b">분자량은 단위 없는 상대값이다 — 몰 질량과 구분한다</text>

  <rect x="24" y="56" width="364" height="164" rx="12" fill="#eff9ff" stroke="#189fe6" stroke-width="2"/>
  <rect x="412" y="56" width="364" height="164" rx="12" fill="#eef1f5" stroke="#6b7684" stroke-width="2"/>

  <!-- 분자량 -->
  <text x="44" y="84" font-size="15" font-weight="600" fill="#189fe6">분자량 — 단위 없는 상대값</text>
  <text x="44" y="108" font-size="13" fill="#6b7684">탄소-12 원자 질량의 1/12 을 1 로 놓고 견준다</text>
  <rect x="44" y="140" width="6" height="18" fill="#6b7684"/>
  <text x="58" y="154" font-size="12" fill="#6b7684">기준 1 = 탄소-12 원자 질량의 1/12</text>
  <rect x="44" y="176" width="192" height="18" rx="2" fill="#189fe6"/>
  <text x="244" y="190" font-size="13" font-weight="600" fill="#20242b">산소 분자 O<tspan dy="4" font-size="11">2</tspan><tspan dy="-4"> = 32</tspan></text>

  <!-- 몰 질량 -->
  <text x="432" y="84" font-size="15" font-weight="600" fill="#20242b">몰 질량 — 1 mol 의 질량</text>
  <text x="432" y="108" font-size="13" fill="#6b7684">g/mol 이라는 단위가 붙는다</text>
  <rect x="432" y="140" width="140" height="50" rx="8" fill="#eff9ff" stroke="#189fe6" stroke-width="2"/>
  <text x="502" y="162" text-anchor="middle" font-size="13" fill="#20242b">산소 O<tspan dy="4" font-size="11">2</tspan></text>
  <text x="502" y="180" text-anchor="middle" font-size="12" fill="#6b7684">1 mol (6.02 × 10<tspan dy="-5" font-size="9">23</tspan><tspan dy="5"> 개)</tspan></text>
  <line x1="580" y1="165" x2="612" y2="165" stroke="#189fe6" stroke-width="2" stroke-linecap="round" marker-end="url(#a)"/>
  <rect x="622" y="140" width="140" height="50" rx="8" fill="#def2ff" stroke="#0e82c4" stroke-width="2"/>
  <text x="692" y="172" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">32 g/mol</text>
  <text x="432" y="212" font-size="12" fill="#6b7684">수는 32 로 같지만 뜻과 단위가 다르다</text>

  <!-- 같은 질량, 다른 양(mol) -->
  <text x="24" y="252" font-size="15" font-weight="600" fill="#20242b">질량이 같아도 분자량이 크면 들어 있는 양(mol)은 적다</text>

  <rect x="24" y="266" width="364" height="92" rx="12" fill="#eff9ff" stroke="#0e82c4" stroke-width="1.5"/>
  <rect x="412" y="266" width="364" height="92" rx="12" fill="#eff9ff" stroke="#0e82c4" stroke-width="1.5"/>

  <text x="206" y="292" text-anchor="middle" font-size="15" font-weight="600" fill="#189fe6">산소 O<tspan dy="4" font-size="11">2</tspan><tspan dy="-4"> — 분자량 32</tspan></text>
  <g fill="#189fe6">
    <use href="#o2" x="110" y="322"/><use href="#o2" x="206" y="322"/><use href="#o2" x="302" y="322"/>
  </g>
  <text x="206" y="350" text-anchor="middle" font-size="13" font-weight="600" fill="#20242b">32 g = 1 mol</text>

  <text x="594" y="292" text-anchor="middle" font-size="15" font-weight="600" fill="#dc2626">메테인 CH<tspan dy="4" font-size="11">4</tspan><tspan dy="-4"> — 분자량 16</tspan></text>
  <g fill="#dc2626">
    <use href="#ch4" x="452" y="322"/><use href="#ch4" x="500" y="322"/><use href="#ch4" x="548" y="322"/>
    <use href="#ch4" x="596" y="322"/><use href="#ch4" x="644" y="322"/><use href="#ch4" x="692" y="322"/>
  </g>
  <text x="594" y="350" text-anchor="middle" font-size="13" font-weight="600" fill="#20242b">32 g = 2 mol</text>

  <text x="400" y="384" text-anchor="middle" font-size="13" fill="#6b7684">온도와 압력이 같다면 분자량이 큰 기체일수록 밀도가 크게 나타난다</text>
</svg>
