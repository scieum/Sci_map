<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380"
     font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <title>무극성 분자 — 평균 전자 분포가 대칭이라 영구 쌍극자가 없지만, 순간 쌍극자는 생기므로 식히면 액체가 된다</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#189fe6"/>
    </marker>
  </defs>

  <text x="400" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#20242b">무극성 분자 — 평균은 대칭, 순간은 치우침</text>

  <!-- 1 -->
  <rect x="24" y="50" width="240" height="232" rx="12" fill="#eff9ff" stroke="#189fe6" stroke-width="1.5"/>
  <text x="144" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">① 평균으로 보면</text>
  <ellipse cx="144" cy="150" rx="76" ry="44" fill="#def2ff" stroke="#189fe6" stroke-width="1.5"/>
  <line x1="144" y1="96" x2="144" y2="204" stroke="#6b7684" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="114" cy="150" r="22" fill="#eef1f5" stroke="#6b7684" stroke-width="2"/>
  <text x="114" y="150" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#20242b">O</text>
  <circle cx="174" cy="150" r="22" fill="#eef1f5" stroke="#6b7684" stroke-width="2"/>
  <text x="174" y="150" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#20242b">O</text>
  <text x="144" y="224" text-anchor="middle" font-size="13" font-weight="600" fill="#20242b">전자 분포가 좌우 대칭</text>
  <text x="144" y="246" text-anchor="middle" font-size="13" fill="#6b7684">영구 쌍극자가 없다</text>
  <text x="144" y="268" text-anchor="middle" font-size="12" fill="#6b7684">예: 산소 O<tspan dy="4" font-size="10">2</tspan><tspan dy="-4">, 질소 N</tspan><tspan dy="4" font-size="10">2</tspan></text>

  <!-- 2 -->
  <rect x="280" y="50" width="240" height="232" rx="12" fill="#eff9ff" stroke="#189fe6" stroke-width="1.5"/>
  <text x="400" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">② 어느 한 순간</text>
  <ellipse cx="384" cy="150" rx="76" ry="44" fill="#def2ff" stroke="#189fe6" stroke-width="1.5"/>
  <line x1="400" y1="96" x2="400" y2="204" stroke="#6b7684" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="370" cy="150" r="22" fill="#eef1f5" stroke="#6b7684" stroke-width="2"/>
  <text x="370" y="150" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#20242b">O</text>
  <circle cx="430" cy="150" r="22" fill="#eef1f5" stroke="#6b7684" stroke-width="2"/>
  <text x="430" y="150" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#20242b">O</text>
  <text x="320" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#dc2626">δ<tspan dy="-5" font-size="10">−</tspan></text>
  <text x="464" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#189fe6">δ<tspan dy="-5" font-size="10">+</tspan></text>
  <text x="400" y="224" text-anchor="middle" font-size="13" font-weight="600" fill="#20242b">전자가 잠깐 한쪽으로 몰린다</text>
  <text x="400" y="246" text-anchor="middle" font-size="13" fill="#6b7684">짧은 시간 순간 쌍극자가 생긴다</text>
  <text x="400" y="268" text-anchor="middle" font-size="12" fill="#d97706">곧 사라지고 다른 쪽에 다시 생긴다</text>

  <!-- 3 -->
  <rect x="536" y="50" width="240" height="232" rx="12" fill="#eff9ff" stroke="#189fe6" stroke-width="1.5"/>
  <text x="656" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">③ 그래서</text>
  <rect x="560" y="108" width="76" height="100" rx="8" fill="#eef1f5" stroke="#6b7684" stroke-width="2"/>
  <circle cx="580" cy="130" r="4" fill="#189fe6"/>
  <circle cx="612" cy="150" r="4" fill="#189fe6"/>
  <circle cx="590" cy="180" r="4" fill="#189fe6"/>
  <circle cx="620" cy="192" r="4" fill="#189fe6"/>
  <circle cx="600" cy="120" r="4" fill="#189fe6"/>
  <text x="598" y="224" text-anchor="middle" font-size="12" fill="#6b7684">기체</text>
  <line x1="644" y1="158" x2="682" y2="158" stroke="#189fe6" stroke-width="2" marker-end="url(#a)"/>
  <text x="663" y="144" text-anchor="middle" font-size="12" fill="#6b7684">온도 ↓</text>
  <rect x="690" y="108" width="76" height="100" rx="8" fill="#eef1f5" stroke="#6b7684" stroke-width="2"/>
  <rect x="692" y="168" width="72" height="38" fill="#def2ff"/>
  <circle cx="704" cy="180" r="4" fill="#189fe6"/>
  <circle cx="722" cy="190" r="4" fill="#189fe6"/>
  <circle cx="740" cy="180" r="4" fill="#189fe6"/>
  <circle cx="714" cy="199" r="4" fill="#189fe6"/>
  <circle cx="744" cy="197" r="4" fill="#189fe6"/>
  <rect x="690" y="108" width="76" height="100" rx="8" fill="none" stroke="#6b7684" stroke-width="2"/>
  <text x="728" y="224" text-anchor="middle" font-size="12" fill="#6b7684">액체</text>
  <text x="656" y="248" text-anchor="middle" font-size="13" font-weight="600" fill="#20242b">충분히 식히면 액체가 된다</text>
  <text x="656" y="270" text-anchor="middle" font-size="12" fill="#6b7684">분산력이 작용하기 때문이다</text>

  <text x="400" y="322" text-anchor="middle" font-size="13" fill="#6b7684">무극성 분자끼리는 쌍극자·쌍극자 힘이 작용하지 않는다 — 작용하는 것은 분산력이다.</text>
  <text x="400" y="350" text-anchor="middle" font-size="12" fill="#d97706">힘이 아예 없다면 산소도 질소도 아무리 식혀도 액체가 되지 않을 것이다.</text>
</svg>
