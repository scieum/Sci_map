<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="800" height="370"
     font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <title>극성 분자 — 결합에 극성이 있어도 분자 모양이 대칭이면 쌍극자가 상쇄되어 무극성 분자가 된다</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#189fe6"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#0e82c4"/>
    </marker>
  </defs>

  <text x="400" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#20242b">극성 분자 — 결합의 쌍극자가 상쇄되는가</text>

  <!-- 왼쪽: 물 -->
  <rect x="40" y="50" width="350" height="232" rx="12" fill="#eff9ff" stroke="#189fe6" stroke-width="2"/>
  <text x="215" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">물 H<tspan dy="4" font-size="11">2</tspan><tspan dy="-4">O — 굽은 모양 (대칭 아님)</tspan></text>

  <line x1="150" y1="205" x2="215" y2="140" stroke="#6b7684" stroke-width="2"/>
  <line x1="280" y1="205" x2="215" y2="140" stroke="#6b7684" stroke-width="2"/>
  <line x1="168" y1="187" x2="203" y2="152" stroke="#189fe6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="262" y1="187" x2="227" y2="152" stroke="#189fe6" stroke-width="2" marker-end="url(#a)"/>

  <circle cx="215" cy="140" r="26" fill="#eef1f5" stroke="#6b7684" stroke-width="2"/>
  <text x="215" y="140" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="600" fill="#20242b">O</text>
  <circle cx="150" cy="205" r="19" fill="#eef1f5" stroke="#6b7684" stroke-width="2"/>
  <text x="150" y="205" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#20242b">H</text>
  <circle cx="280" cy="205" r="19" fill="#eef1f5" stroke="#6b7684" stroke-width="2"/>
  <text x="280" y="205" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#20242b">H</text>

  <text x="215" y="102" text-anchor="middle" font-size="15" font-weight="600" fill="#dc2626">δ<tspan dy="-5" font-size="10">−</tspan></text>
  <text x="122" y="216" text-anchor="middle" font-size="15" font-weight="600" fill="#189fe6">δ<tspan dy="-5" font-size="10">+</tspan></text>
  <text x="308" y="216" text-anchor="middle" font-size="15" font-weight="600" fill="#189fe6">δ<tspan dy="-5" font-size="10">+</tspan></text>

  <line x1="345" y1="215" x2="345" y2="128" stroke="#0e82c4" stroke-width="3" marker-end="url(#b)"/>
  <text x="357" y="176" font-size="12" fill="#0e82c4">합</text>

  <text x="215" y="264" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">쌍극자의 합 ≠ 0 → 극성 분자</text>

  <!-- 오른쪽: 이산화 탄소 -->
  <rect x="410" y="50" width="350" height="232" rx="12" fill="#f3f5f8" stroke="#dc2626" stroke-width="2"/>
  <text x="585" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">이산화 탄소 CO<tspan dy="4" font-size="11">2</tspan><tspan dy="-4"> — 직선 모양 (대칭)</tspan></text>

  <text x="585" y="112" text-anchor="middle" font-size="12" fill="#6b7684">크기가 같고 방향이 반대</text>
  <line x1="560" y1="140" x2="516" y2="140" stroke="#189fe6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="610" y1="140" x2="654" y2="140" stroke="#189fe6" stroke-width="2" marker-end="url(#a)"/>

  <path d="M527 170 H560 M527 180 H560 M610 170 H643 M610 180 H643" stroke="#6b7684" stroke-width="2"/>
  <circle cx="500" cy="175" r="26" fill="#eef1f5" stroke="#6b7684" stroke-width="2"/>
  <text x="500" y="175" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="600" fill="#20242b">O</text>
  <circle cx="585" cy="175" r="24" fill="#eef1f5" stroke="#6b7684" stroke-width="2"/>
  <text x="585" y="175" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="600" fill="#20242b">C</text>
  <circle cx="670" cy="175" r="26" fill="#eef1f5" stroke="#6b7684" stroke-width="2"/>
  <text x="670" y="175" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="600" fill="#20242b">O</text>

  <text x="500" y="226" text-anchor="middle" font-size="15" font-weight="600" fill="#dc2626">δ<tspan dy="-5" font-size="10">−</tspan></text>
  <text x="585" y="226" text-anchor="middle" font-size="15" font-weight="600" fill="#189fe6">δ<tspan dy="-5" font-size="10">+</tspan></text>
  <text x="670" y="226" text-anchor="middle" font-size="15" font-weight="600" fill="#dc2626">δ<tspan dy="-5" font-size="10">−</tspan></text>

  <text x="585" y="264" text-anchor="middle" font-size="15" font-weight="600" fill="#20242b">상쇄되어 합 = 0 → 무극성 분자</text>

  <text x="400" y="310" text-anchor="middle" font-size="13" fill="#6b7684">결합에 극성이 있어도 분자 모양이 대칭이면 쌍극자가 상쇄되어 무극성 분자가 된다.</text>
  <text x="400" y="331" text-anchor="middle" font-size="13" fill="#6b7684">전기음성도 차이가 클수록 그 결합의 쌍극자 모멘트가 커진다 (화살표가 길어진다).</text>
  <text x="400" y="356" text-anchor="middle" font-size="12" fill="#d97706">δ 는 부분 전하일 뿐이다 — 분자 전체의 전하는 0 이라 이온과 다르다.</text>
</svg>
