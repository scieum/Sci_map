<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410"
     font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <title>기준 끓는점 — 외부 압력을 1 atm으로 고정했을 때의 끓는점이라 여러 액체를 같은 잣대로 견줄 수 있다</title>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#6b7684"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#20242b">기준 끓는점 — 외부 압력을 1 atm 으로 못박은 끓는점</text>
  <text x="400" y="52" text-anchor="middle" font-size="13" fill="#6b7684">압력을 하나로 고정해야 여러 액체의 끓는점을 같은 잣대로 견줄 수 있다</text>

  <!-- 축 (끓는점 그림과 같은 눈금) -->
  <line x1="90" y1="330" x2="726" y2="330" stroke="#6b7684" stroke-width="1.5" marker-end="url(#g)"/>
  <line x1="90" y1="330" x2="90" y2="70" stroke="#6b7684" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="726" y="352" text-anchor="end" font-size="12" fill="#6b7684">온도 (℃)</text>
  <text x="34" y="200" transform="rotate(-90 34 200)" text-anchor="middle" font-size="12" fill="#6b7684">증기 압력 (mmHg)</text>
  <line x1="84" y1="110" x2="90" y2="110" stroke="#6b7684" stroke-width="1.5"/>
  <line x1="84" y1="220" x2="90" y2="220" stroke="#6b7684" stroke-width="1.5"/>
  <text x="78" y="114" text-anchor="end" font-size="12" fill="#6b7684">760</text>
  <text x="78" y="224" text-anchor="end" font-size="12" fill="#6b7684">380</text>
  <text x="78" y="334" text-anchor="end" font-size="12" fill="#6b7684">0</text>

  <!-- 곡선 두 개 -->
  <path d="M90 326 C200 316, 300 288, 395 228 C430 200, 465 155, 507 76"
        fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 4" stroke-linecap="round"/>
  <path d="M90 329 C240 326, 340 310, 430 268 C500 236, 560 180, 608 94"
        fill="none" stroke="#189fe6" stroke-width="2.5" stroke-linecap="round"/>
  <text x="376" y="86" font-size="13" font-weight="600" fill="#dc2626">에탄올 (점선)</text>
  <text x="618" y="88" font-size="13" font-weight="600" fill="#189fe6">물</text>

  <!-- 약속된 외부 압력 -->
  <line x1="90" y1="110" x2="700" y2="110" stroke="#0e82c4" stroke-width="2.5"/>
  <text x="96" y="102" font-size="12" fill="#0e82c4">외부 압력 1 atm = 760 mmHg — 모두 이 압력에서 견준다</text>

  <path d="M488 102 L496 110 L488 118 L480 110 Z" fill="#dc2626"/>
  <circle cx="598" cy="110" r="6" fill="#0e82c4"/>
  <line x1="488" y1="110" x2="488" y2="330" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="598" y1="110" x2="598" y2="330" stroke="#0e82c4" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="488" y="350" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">78 ℃</text>
  <text x="598" y="350" text-anchor="middle" font-size="13" font-weight="600" fill="#0e82c4">100 ℃</text>

  <text x="776" y="142" text-anchor="end" font-size="12" fill="#6b7684">1 atm 선과 만나는</text>
  <text x="776" y="160" text-anchor="end" font-size="12" fill="#6b7684">온도 = 기준 끓는점</text>

  <text x="400" y="376" text-anchor="middle" font-size="13" fill="#6b7684">압력을 맞추었으므로 78 ℃ 와 100 ℃ 를 곧바로 견줄 수 있다 — 기준 끓는점이 높을수록 분자 간 상호 작용이 크다.</text>
  <text x="400" y="398" text-anchor="middle" font-size="12" fill="#d97706">1 atm 이 아닌 압력에서 끓는 온도는 그냥 끓는점이다. 기준 끓는점은 그중 한 점일 뿐, 가장 높은 온도가 아니다.</text>
</svg>
